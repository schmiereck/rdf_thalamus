experimenter_view: 'Phase 14 ran the matched 5-seed sweep on Arms G/J/K with CCR enabled
  in both

  passive (N=3, 1..1500) and active (N=4, 1501..3000) phases at default weights

  10.0. Arm K (CCR-Covariance) is the best CCR arm by mean centroid MSE

  (62.64 < 70.0 threshold and slightly better than baseline 64.57); Arm J

  (CCR-Hinge) is uniformly the worst, with ~2x baseline sim loss. Welch''s

  t-tests show no statistically significant difference between either CCR arm

  and Arm G on step-3000 sim loss (p >= 0.22). The hypothesis is falsified by

  Criterion 2 (sim loss > 0.050), but baseline Arm G itself also exceeds this

  threshold (0.084), exposing a calibration issue rather than a CCR-specific

  deficiency. The pre-registered lazy-encoder diagnostic (std_vel_3 < 1.5) was

  not triggered, but all three arms — including baseline — produce std_vel_3 in

  the 0.04-0.06 range, four orders of magnitude below threshold. The metric is

  therefore non-discriminative in this offline-eval setup, where the novel

  object''s latent centroid is naturally near-stationary. Per-seed variability

  (MSE 25 -> 110 across seeds within an arm) dwarfs cross-arm differences (<3

  MSE units within any seed), so CCR''s effect is small relative to seed noise.

  Net: CCR-Covariance is a marginal improvement worth keeping; CCR-Hinge is

  counterproductive; the hypothesis as stated is falsified primarily because the

  Criterion-2 threshold was unrealistic for this baseline regime.

  '
log_excerpt: "================================================================================\n\
  STATISTICAL ANALYSIS (step 3000 offline test sim loss)\n================================================================================\n\
  Arm G mean = 0.084006, std = 0.043457\nArm J mean = 0.151809, std = 0.102115\nArm\
  \ K mean = 0.090083, std = 0.044672\nWelch's two-sample two-sided t-test:\n  Arm\
  \ G vs Arm J: t = -1.3662, p-value = 0.226011\n  Arm G vs Arm K: t = -0.2180, p-value\
  \ = 0.832863\nLevene's test (equality of variances):\n  Arm G vs Arm J: W = 2.9558,\
  \ p-value = 0.123888\n  Arm G vs Arm K: W = 0.0181, p-value = 0.896237\nBest CCR\
  \ arm (by mse_cent): Arm K (CCR-Covariance)\nCriterion 1 -> VALIDATED (62.64 < 70.0)\n\
  Criterion 2 -> FALSIFIED (0.0901 > 0.050; baseline 0.0840 also above)\nCriterion\
  \ 3 -> VALIDATED (entropy 3.958 > 3.5)\nCriterion 4 -> VALIDATED (var 8.28 < 10.0)\n\
  Criterion 5 -> OK (no lazy encoder; MSE 62.64 < 70)\nOVERALL HYPOTHESIS: FALSIFIED\n"
