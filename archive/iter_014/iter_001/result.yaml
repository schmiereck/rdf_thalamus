experimenter_view: "Contrastive Coordinate Regularization (CCR) via covariance penalty\
  \ (Arm K) successfully reduces centroid decoding MSE of the novel object to 62.64,\
  \ which is well below the pre-registered falsification limit of 70.0 and superior\
  \ to the baseline CLTS (Arm G, 64.57). \nHowever, both Arm K (0.0901) and Arm G\
  \ (0.0840) exceeded the pre-registered post-collision test simulation loss limit\
  \ of 0.050, resulting in technical falsification due to calibration. Welch's t-test\
  \ confirmed no statistical difference in predictive loss between Arm K and Arm G\
  \ (p = 0.8329), demonstrating that covariance-based regularization does not degrade\
  \ predictive accuracy. \nIn contrast, Arm J (CCR-Hinge) significantly degraded predictive\
  \ loss (0.1518), indicating that hard hinge penalties are more difficult to backpropagate\
  \ than soft covariance constraints.\nThe lazy encoder tracking metric (std_vel_3)\
  \ showed that coordinates naturally move very smoothly (~0.04 pixels/frame), making\
  \ the 1.5 pixels/frame threshold non-discriminative for active representational\
  \ freezing in this sequence.\n"
