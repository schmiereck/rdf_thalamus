falsification_criterion: 'The hypothesis will be falsified if, across a 5-seed comparative
  sweep, any of the following occur:

  1. The mean soft spatial variance of the Spatial Coordinate Stream ($z^{coord}$)
  is $> 75.0$.

  2. The overall test simulation loss of the DSDT model is not reduced by at least
  15% compared to Arm C of Phase 9 (i.e., the ratio of DSDT test simulation loss to
  Arm A''s test simulation loss is $\ge 1.10$).

  3. The Dual-Stream representation suffers from structural instability or collapse
  (defined as a representation collapse rate $> 0.0\%$ across the 5 training seeds).

  '
hypothesis: 'In the Thalamus architecture, decoupling each recruited representation
  channel into a dual-stream latent space—consisting of a highly localized Spatial
  Coordinate Stream ($z^{coord}$, subject to a strong spatial variance minimization
  penalty $\lambda$) and a parallel Temporal Dynamics Stream ($z^{dyn}$, free of the
  spatial penalty and optimized for transition dynamics)—resolves the fundamental
  trade-off between spatial localization and predictive capacity. Specifically, this
  Dual-Stream Decoupled Thalamus (DSDT) architecture will achieve a soft spatial variance
  $\le 75.0$ (matching the spatial localization of the DSMC/Strong Bottlenecks) while
  simultaneously reducing the test simulation prediction loss by at least 15% relative
  to the single-stream DSMC (Arm C of Phase 9), thereby achieving a test simulation
  loss ratio vs. the Gentle Bottleneck (Arm A) of $< 1.10$.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "1. **Dual-Stream Architecture Implementation**: Modify the representation\
  \ node structure in the model definition files (e.g., `src/models.py` or `src/thalamus.py`).\
  \ For each recruited dimension, split the latent output into:\n   - $z^{coord}_t\
  \ \\in \\mathbb{R}^1$: computed via a highly constrained spatial softmax/centroid\
  \ bottleneck and regularized by the adaptive spatial variance loss $\\mathcal{L}_{var}\
  \ = \\lambda(t) \\cdot \\text{Var}(z^{coord}_t)$.\n   - $z^{dyn}_t \\in \\mathbb{R}^d$:\
  \ computed without spatial compression, preserving high-frequency visual and motion\
  \ features.\n2. **Predictive Coupling and Stop-Gradients**: Implement the temporal\
  \ prediction network such that $z^{dyn}_t$ is used to predict $z^{coord}_{t+1}$\
  \ and $z^{dyn}_{t+1}$. Apply a stop-gradient operator on $z^{coord}_t$ during the\
  \ temporal prediction backpropagation. This ensures that temporal prediction gradients\
  \ do not bleed into and dilute the spatial localization of the coordinate stream,\
  \ while allowing the dynamics stream to leverage spatial coordinate context.\n3.\
  \ **Control and Experimental Setup**:\n   - **Arm A (Control 1)**: Gentle Spatial\
  \ Bottleneck (re-run or compared with Phase 9 baseline).\n   - **Arm C (Control\
  \ 2)**: Single-stream DSMC (from Phase 9).\n   - **Arm D (Experimental)**: Dual-Stream\
  \ Decoupled Thalamus (DSDT) with adaptive spatial variance penalty $\\lambda(t)$.\n\
  4. **Multi-Seed Evaluation Sweep**: Train all arms over a 5-seed sweep under the\
  \ parameterized 1D physics environment (including the $N=3 \\to N=4$ object transition\
  \ event).\n5. **Metrics Logging**: Log soft spatial variance, centroid decoding\
  \ MSE (using a linear probe as a diagnostic check of coordinate quality), test simulation\
  \ prediction loss, and representation collapse rates.\n"
