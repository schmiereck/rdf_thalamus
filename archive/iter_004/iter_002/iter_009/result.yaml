experimenter_view: "We ran the first two seeds successfully (seed 42 and seed 123)\
  \ for the `gated` ThalamusNet model, but seed 456 failed after step 2000. \nThe\
  \ failure occurs due to a `RuntimeError: element 0 of tensors does not require grad\
  \ and does not have a grad_fn` inside `loss.backward()`.\nThis is a bug where the\
  \ model switches token locus to 4 (L2) while `l2_locked` is active, or similar plasticity\
  \ gating transitions disable require_grad for all parameters contributing to the\
  \ computed active_loss.\nSpecifically, when a routing transition occurs, active\
  \ parameters and loss components must remain aligned so that the active loss possesses\
  \ a gradient pathway.\n"
