falsification_criterion: "PRE-DECLARED FALSIFICATION CRITERIA:\n\n1. M2 (slowness\
  \ as representation-shaping mechanism) is REFUTED iff\n   delta_R2_color < 0.10\
  \ across ALL k ∈ {20, 50, 100} for d_max=8 (Arms A-C)\n   AND delta_R2_color ≤ 0.137\
  \ (iter_023 d_max=16 baseline) for d_max=16 (Arm E).\n   No post-hoc reframing of\
  \ \"SFA works\" if only z_dyn temporal variance moves —\n   variance reduction is\
  \ mechanical, not the claim.\n\n2. Temporal contrastive (Arm D) is deemed PROMISING\
  \ iff delta_R2_color ≥ 0.15,\n   exceeding the iter_023 best of 0.137 (which was\
  \ a capacity effect, not an\n   objective effect). If delta_R2_color < 0.10 for\
  \ Arm D, the temporal\n   contrastive approach does not meaningfully improve identity\
  \ encoding.\n\n3. C5 is DROPPED ENTIRELY from this iteration. It is a structurally\
  \ impossible\n   metric artifact (iter_023: 0/35 seeds). Re-running it would be\
  \ construction,\n   not evidence.\n\n4. Early checkpoint at step 2000: if ALL multi-step\
  \ SFA arms (A-C) show\n   delta_R2_color < 0.08 at the checkpoint, the slowness\
  \ hypothesis is\n   effectively dead regardless of final-step results, and the contrastive\n\
  \   finding becomes the primary outcome.\n"
hypothesis: 'Two-part hypothesis tested simultaneously:


  PART A (last slowness shot): Multi-step SFA with temporal horizon k∈{20,50,100}

  accumulates gradient over longer windows than single-step SFA (k=1), enabling

  extraction of features that are slow at longer timescales. Specifically, multi-step

  SFA computes L_SFA_k = ||z_dyn(t) - z_dyn(t-k)||² / k using a z_dyn trajectory

  buffer maintained during training. If identity features require longer temporal

  integration to separate from position-related z_dyn variation, then k>>1 should

  produce delta_R2_color improvement where k=1 failed.


  PART B (non-slowness probe): Temporal contrastive learning (NT-Xent) on z_dyn,

  where positive pairs are same-trajectory z_dyn at different timesteps and negative

  pairs are z_dyn from different trajectories in the same batch, will produce

  identity encoding because: (1) temporal invariance (positives) makes z_dyn stable

  like SFA, and (2) cross-scene discrimination (negatives) forces z_dyn to encode

  scene-specific information that is NOT position (handled by z_coord), leaving

  identity as the primary discriminable attribute. The NT-Xent loss is:

  L_contra = -log(exp(sim(z_target_dyn[i], z_hist_dyn[i,-1])/τ) / Σ_j exp(sim(z_target_dyn[i],
  z_hist_dyn[j,-1])/τ))

  with cosine similarity and temperature τ=0.1.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "EXPERIMENT DESIGN: 6 arms × variable seeds × 5000 steps.\nSeeds:\
  \ [42, 123, 456, 789, 999] for main arms; [42] for diagnostic arm.\nTotal runs:\
  \ 26 (within the ~35-run budget of iter_023).\n\nARM CONFIGURATIONS:\n\nArm A (Multi-step\
  \ SFA k=20, d_max=8): 5 seeds\n  - primary_objective=\"sfa\", sfa_weight=10.0 (ramp\
  \ 0.1→10.0 over 500 steps)\n  - Multi-step SFA with k=20 using z_dyn trajectory\
  \ buffer\n  - CGIR, CCR covariance, d_t=3, sim_weight=25.0, var_weight=25.0, cov_weight=25.0\n\
  \nArm B (Multi-step SFA k=50, d_max=8): 5 seeds\n  - Same as Arm A but sfa_k=50\n\
  \nArm C (Multi-step SFA k=100, d_max=8): 5 seeds\n  - Same as Arm A but sfa_k=100\n\
  \nArm D (Temporal Contrastive, d_max=8): 5 seeds\n  - primary_objective=\"contrastive\"\
  , contrastive_weight=25.0, temperature=0.1\n  - NO SFA loss (sfa_weight=0). NT-Xent\
  \ replaces SFA as the temporal objective.\n  - CGIR, CCR covariance, d_t=3, sim_weight=25.0,\
  \ var_weight=25.0, cov_weight=25.0\n\nArm E (d_max=16 + Multi-step SFA k=50): 5\
  \ seeds\n  - Same as Arm B but d_max=16 (carrying forward the best capacity from\
  \ iter_023)\n\nArm F (JEPA stop-gradient diagnostic): 1 seed\n  - Same as Arm B\
  \ (k=50, d_max=8) but sim_weight=0\n  - Tests whether removing the JEPA readout\
  \ entirely changes the picture\n\nMULTI-STEP SFA IMPLEMENTATION:\n- Maintain a z_dyn\
  \ trajectory buffer (collections.deque, maxlen=110) alongside\n  the replay buffer\
  \ during training\n- At each step, encode the current environment frame (x_current)\
  \ through the\n  encoder WITH gradients and store z_dyn.detach() in the trajectory\
  \ buffer\n- For the multi-step SFA loss: sfa_loss_k = MSE(z_dyn_current, z_dyn_trajectory[-k-1])\
  \ / k\n- The gradient flows through z_dyn_current back to the encoder; z_past is\
  \ a\n  fixed (detached) target from the buffer\n- This requires one additional encoder\
  \ forward pass per step (batch_size=1),\n  which is ~3% overhead over the main batch\
  \ forward pass\n- The SFA loss is ADDED to the main loss (VICReg + JEPA readout),\
  \ replacing\n  the single-step SFA in the model's forward pass (set sfa_weight=0\
  \ in model,\n  compute multi-step SFA externally)\n\nTEMPORAL CONTRASTIVE (NT-Xent)\
  \ IMPLEMENTATION:\n- Computed inside NonParametricJEPASpatial.forward() in the SFA\
  \ branch\n- Uses z_target_dyn (anchor, WITH gradients) and z_hist_dyn[:,-1] (positive,\n\
  \  WITH gradients — standard SimCLR, no stop-gradient needed since VICReg\n  prevents\
  \ collapse)\n- NT-Xent loss:\n  z_anchor = F.normalize(z_target_dyn[:, :d_t_dyn],\
  \ dim=-1)  # (B, d_t_dyn)\n  z_positive = F.normalize(z_hist_dyn[:, -1, :d_t_dyn],\
  \ dim=-1)  # (B, d_t_dyn)\n  sim_matrix = mm(z_anchor, z_positive.T) / τ  # (B,\
  \ B)\n  labels = arange(B)  # diagonal = positive pairs\n  contrastive_loss = cross_entropy(sim_matrix,\
  \ labels)\n- Uses full d_t-dimensional z_dyn vector (not per-dimension) to allow\
  \ the\n  model to allocate different dimensions to different identity aspects\n\n\
  CODE CHANGES:\n1. src/models_dual_stream.py: Add contrastive_weight and temperature\
  \ parameters\n   to NonParametricJEPASpatial.__init__(). In the SFA forward branch,\
  \ add\n   NT-Xent contrastive loss computation before the detach operations. Add\n\
  \   \"contrastive\" as a new primary_objective option that uses NT-Xent instead\n\
  \   of SFA. Add contrastive_loss to the returned loss dict.\n\n2. src/run_phase0_sfa_multistep.py\
  \ (NEW): Main experiment runner.\n   - Based on run_phase0_sfa_sweep.py structure\n\
  \   - 6 arms × variable seeds × 5000 steps\n   - For Arms A-C, E: multi-step SFA\
  \ via z_dyn trajectory buffer\n   - For Arm D: temporal contrastive (model-level)\n\
  \   - For Arm F: sim_weight=0 diagnostic\n   - Same evaluation suite: semantic probes,\
  \ collapse checks, centroid MSE,\n     tracking quality, normalized temporal variance\n\
  \   - Results saved to archive/iter_024/results/\n\n3. src/pre_registration.md:\
  \ Updated with this plan.\n\nMETRICS (same as iter_023, directly comparable):\n\
  1. delta_R2_color (PRIMARY criterion — improvement over iter_023 baseline of 0.05)\n\
  2. delta_R2_identity\n3. C1 (Collapse): per_dim_std < 0.5 in < 2/5 seeds per arm\n\
  4. Centroid MSE\n5. Normalized temporal variance (dyn and coord)\n6. Slowness ratio\n\
  7. Per-dim std, collapse counts\n8. Tracking quality\n9. GDASR growth-point logs\
  \ (log-only mode)\n10. Step-2000 checkpoint evaluation for early falsification\n\
  \nTRAINING PROTOCOL:\n- 5000 steps, Adam lr=1e-3, batch_size=32, replay_buffer=2000\n\
  - d_t=3 frozen, gdasr_log_only=True\n- All arms: CGIR dyn_readout, CCR covariance\
  \ mode\n- SFA ramp: 0.1 → target_weight over 500 steps (stability from iter_023\
  \ A6)\n- For multi-step SFA arms: trajectory buffer pre-filled during the first\
  \ 110\n  steps of environment interaction before SFA loss computation begins\n"
