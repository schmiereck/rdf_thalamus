experimenter_view: 'The full 5000-step multi-step SFA training completed successfully
  across all

  26 configurations. Arms B (k=50, d_max=8) and E (k=50, d_max=16) achieved

  modestly positive delta_R2_color (~0.03), indicating the dynamic stream

  encodes slightly more color information than the coordinate stream. Arm C

  (k=100) showed the lowest trajectory variance but the most negative

  delta_R2_color, suggesting that excessive sub-feature pooling may oversmooth

  semantic content. The contrastive Arm D exhibited dramatically higher

  within-trajectory and between-trajectory variance (~0.63 and ~0.45) compared

  to SFA arms, confirming that NT-Xent produces less temporally stable

  representations. The diagnostic Arm F (sim_weight=0) performed worst on

  centroid decoding (MSE=206.3, R=0.19), validating that the similarity term

  is critical for spatial tracking quality. All arms showed near-zero shuffled

  delta_r2_color, indicating probe results are not spurious.

  '
