experimenter_view: 'The SeparateDynEncoder was successfully extended to support a
  new

  `centroid_gated` dyn_readout mode. In this mode, the spatial attention

  probabilities from the coord backbone (via softmax over the spatial map)

  are used to compute a weighted sum of the dyn backbone features. This

  allows the dynamics representation to be spatially grounded while keeping

  the two backbones parameter-independent. The implementation correctly

  handles both sub_features=1 (flat output) and sub_features>1 (reshaped

  multi-channel output). All import and forward-pass tests passed.

  '
