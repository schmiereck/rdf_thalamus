experimenter_view: 'The full 80-run experiment (4 arms × 20 seeds × 8000 steps) completed
  successfully,

  but the scientific hypothesis was decisively rejected. The rich dyn readout with

  centroid-gated aggregation (E2, K=4 sub-features) collapsed on 100% of seeds (20/20),

  as did the SFA+VICReg variant (E3, 20/20). The baseline mean-pool (E1) remained

  stable with 0% collapse. This indicates that adding rich sub-feature structure

  to the dyn stream, gated by centroid proximity, does NOT solve the collapse

  problem — in fact, it makes it worse. The per-dim std values in collapsed runs

  were ~0.3–0.5, well below the 0.5 threshold. The scalar centroid-gated variant

  (E1.5) was intermediate at 10% collapse. All pre-registered gate criteria (F1–F5)

  failed. The binding decision rule correctly triggers BRANCH (b): hard-pivot to

  behavioral evaluation using the best available representation (E1 baseline).

  '
log_excerpt: 'Saved summary to archive/iter_032/results\summary.csv

  Saved analysis to archive/iter_032/results\analysis.md


  # Gate Evaluation (CRITICAL)

  - F1 (mean E2 ΔR²_color (non-collapsed) >= 0.30): FAIL (ALL seeds collapsed)

  - F2 (lower 95% CI of E2 mean ΔR²_color >= 0.18): FAIL (insufficient non-collapsed
  seeds)

  - F3 (collapse rate <= 0.10 across ALL arms): FAIL (max_cr=1.00)

  - F4 (E2 - E1 paired-seed mean ΔR² >= 0.10): FAIL (value=-0.0145)

  - F5 (E2 - E1.5 paired-seed mean ΔR² >= 0.10): FAIL (value=0.0380)

  - F6 (E3 - E2 paired-seed mean ΔR² (informational only)): (value=0.0214)


  ## Binding Decision Rule Outcome

  **Outcome:** BRANCH (b) — Hard-pivot to behavioral evaluation (centroid tracking,
  collision selectivity, causal sensitivity) with the best available representation.
  No further representation-only iterations.

  '
