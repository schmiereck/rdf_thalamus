experimenter_view: "The 4-arm experiment yielded a decisive falsification of the rich\
  \ attention-pooled dynamics readout hypothesis.\nSpatially gating dynamics features\
  \ by soft-argmax coordinate centroids (K=4) led to a catastrophic 100% collapse\
  \ rate across all 20 seeds (for both E2 and E3), with dimension-wise standard deviations\
  \ dropping well below our 0.5 stability threshold. This implies that coupling the\
  \ coordinate backbone attention maps directly to the dynamics representation backprop\
  \ paths causes an extreme representations collapse under VICReg's variance-covariance\
  \ constraints. \nIn contrast, the spatial mean-pooling baseline (E1) remained 100%\
  \ stable with 0% collapse, although it was bound to a lower ΔR²_color of ~0.13.\
  \ \nAs pre-registered, failing gate F1 (mean E2 ΔR²_color on non-collapsed seeds\
  \ >= 0.30) triggers the BRANCH (b) HARD-PIVOT protocol. We will pivot to behavioral\
  \ evaluation of downstream agent performance using the most robust representation\
  \ available (mean-pool baseline) rather than seeking further representation-only\
  \ architectural optimizations.\n"
