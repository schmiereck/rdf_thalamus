task: "## Task: Implement Rich Dyn Readout + Run 4-Arm Experiment (iter_032)\n\nRead\
  \ the pre-registration file at src/pre_registration.md FIRST and adhere strictly\
  \ to it. The experiment design, gates, and decision rules are binding.\n\n### Overview\n\
  We need to test whether replacing mean-pool z_dyn with attention-pooled multi-dimensional\
  \ feature vectors breaks through the ΔR²_color ≥ 0.30 threshold. This is a 4-arm\
  \ experiment (E1, E1.5, E2, E3) × 20 seeds = 80 runs.\n\n### Architecture Changes\
  \ Required\n\n**Modify `src/models_separate_dyn.py`** — Update `SeparateDynEncoder`\
  \ to support centroid_gated readout:\n\n1. In `__init__`, when `dyn_readout == \"\
  centroid_gated\"`:\n   - Replace `self.conv_identity_dyn = nn.Conv1d(128, d_max,\
  \ kernel_size=1)` with `self.conv_identity_dyn = nn.Conv1d(128, d_max * sub_features,\
  \ kernel_size=1)`\n   - Keep all other layers the same (coord backbone unchanged)\n\
  \n2. In `forward()`:\n   - Always compute coord backbone first (same as now), producing\
  \ `a_spatial (B, d_max, 128)` and `p_c = F.softmax(a_spatial, dim=-1)`\n   - For\
  \ dyn backbone, produce `dyn_features (B, 128, 8)` then `a_dyn = self.conv_identity_dyn(dyn_features)`\
  \ producing either `(B, d_max, 8)` or `(B, d_max*K, 8)` depending on sub_features\n\
  \   - Implement three readout modes:\n     a. `dyn_readout == \"mean\"` (existing):\
  \ `z_dyn = a_dyn.mean(dim=-1)` → (B, d_max)  [unchanged]\n     b. `dyn_readout ==\
  \ \"centroid_gated\"` with `sub_features == 1`:\n        - Interpolate a_dyn from\
  \ 8 to 128: `a_dyn_128 = F.interpolate(a_dyn, size=128, mode='linear', align_corners=False)`\
  \ → (B, d_max, 128)\n        - `z_dyn = torch.einsum('bcs,bs->bc', p_c.detach(),\
  \ a_dyn_128)` → (B, d_max)\n     c. `dyn_readout == \"centroid_gated\"` with `sub_features\
  \ > 1`:\n        - Interpolate a_dyn from 8 to 128: `a_dyn_128 = F.interpolate(a_dyn,\
  \ size=128, mode='linear', align_corners=False)` → (B, d_max*K, 128)\n        -\
  \ Reshape: `a_dyn_128 = a_dyn_128.reshape(B, d_max, K, 128)` where K = sub_features\n\
  \        - `z_dyn = torch.einsum('bcs,bcks->bck', p_c.detach(), a_dyn_128)` → (B,\
  \ d_max, K)\n        - Reshape: `z_dyn = z_dyn.reshape(B, d_max * K)` → (B, d_max*K)\n\
  \   \n   STOP-GRADIENT on p_c is critical (consistent with existing centroid_gated\
  \ convention) — the coord backbone's attention weights should not receive gradient\
  \ from the dyn readout.\n\n3. The `d_dyn` property should return `d_max * self.sub_features`\
  \ (already exists, verify it works with the new readout).\n\n4. **NonParametricJEPASpatialSeparateDyn**\
  \ must also be updated:\n   - Ensure it correctly passes `dyn_readout` and `sub_features`\
