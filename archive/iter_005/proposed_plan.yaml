falsification_criterion: 'The hypothesis will be proven false if any of the following
  occur:

  1. The physical tracking overlap $\mathcal{O}_{track}$ of $M_{active}$ across the
  5-seed test suite is $< 70.0\%$.

  2. The post-collision L2 prediction loss ratio $\frac{\mathcal{L}_{collision}(M_{active})}{\mathcal{L}_{control}}
  \ge 0.65$ for either control $M_{control} \in \{M_{random}, M_{no\_motor}\}$ (failing
  to demonstrate a $35\%$ reduction in prediction error).

  3. The prediction loss on the attended locus under self-generated attention is $>
  1.15$ times the loss under externally primed attention.

  4. Active closed-loop motor coupling causes drift collapse or numeric instability,
  resulting in an overall test L2 prediction loss higher than the baseline B1 model
  (0.0452).

  '
hypothesis: '1. Replacing the rigid 200-step attention cooldown with an adaptive,
  surprise-modulated cooldown ($C_t \in [10, 30]$ steps) combined with a Proportional-Derivative
  (PD) reflexive motor tracking controller in $M_{active}$ will resolve the physical
  tracking lag from Phase 2, increasing the physical pointer-to-object tracking overlap
  $\mathcal{O}_{track}$ from $11.20\%$ to $\ge 70.0\%$ in the test environment.

  2. Progressive training of the Subsumption Motorics hierarchy (Lower-layer tracking
  -> Upper-layer perturbation) will allow the agent to learn the physical dynamics
  of hidden mass via intentional collisions. This causal sensitivity advantage will
  manifest such that, when evaluated on post-collision velocity predictions with altered
  hidden masses, $M_{active}$ will achieve an L2 prediction loss $\mathcal{L}_{collision}$
  that is at least $35\%$ lower than both the passive control ($M_{no\_motor}$) and
  the random control ($M_{random}$).

  3. Transitioning from externally primed attention queries (guided by color/size)
  to self-generated attention queries (output-as-input loop) will remain stable, with
  the test prediction loss on the attended locus increasing by no more than $15\%$
  relative to the primed attention baseline.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "1. **Adaptive Cooldown & Attention (`src/thalamus.py`)**: Replace\
  \ the rigid 200-step cooldown with a dynamic, surprise-modulated cooldown $C_t =\
  \ \\text{clip}(\\frac{\\alpha}{|\\Delta E_t| + \\epsilon}, 10, 30)$ where $\\Delta\
  \ E_t = E_t - E_{t-1}$ is the temporal change in local surprise.\n2. **Subsumption\
  \ Motor Controller (`src/motor.py`)**: Create/modify the motor module to implement\
  \ three hierarchical layers:\n   - *Lower Layer (Reflexive Tracking)*: A PD controller\
  \ that maps the attended spatial centroid of the attention token to continuous pointer\
  \ acceleration to match the object's position.\n   - *Middle Layer (Predictive Kinematics)*:\
  \ Uses the temporal latent predictions to preemptively adjust the pointer's velocity\
  \ and anticipate the object's path.\n   - *Upper Layer (Deliberate Perturbation)*:\
  \ Detects when tracking error is low and surprise is stabilized (\"boredom\"), and\
  \ overrides lower layers to trigger a \"push\" command to collide with the object.\n\
  3. **Environment Alignment (`src/environment.py`)**: Verify that the 1D physics\
  \ sandbox properly integrates continuous pointer actions (acceleration, push commands)\
  \ and exposes correct bounding box/centroid targets.\n4. **Progressive Coupling\
  \ & Sweep (`src/train_eval.py`)**:\n   - Implement the staged training schedule:\
  \ Steps 0-1000: Decoupled random motor actions; Steps 1000-3000: Lower-layer visual\
  \ tracking active; Steps 3000-5000: Full subsumption motorics (predictive tracking\
  \ + deliberate push perturbations) active.\n   - Execute a systematic 5-seed sweep\
  \ across: $M_{no\\_motor}$ (passive), $M_{random}$ (random exploration), and $M_{active}$\
  \ (proposed model).\n   - Evaluate causal sensitivity by randomizing object masses\
  \ in the test environments and measuring post-collision velocity prediction error.\
  \ Log attention token traces to measure the self-generated vs. primed attention\
  \ loss.\n"
