falsification_criterion: 'The hypothesis will be falsified if any of the following
  occur:

  1. The 4th dimension is recruited in fewer than 3 seeds (less than 60% recruitment
  rate) in Arm O.

  2. The mean post-transition centroid decoding MSE of Arm O is >= 75.0.

  3. The recruited 4th dimension in Arm O is redundant with existing dimensions (mean
  max absolute correlation >= 0.8) or is collapsed (mean variance <= 1e-3).

  4. The test simulation loss of Arm O is significantly higher than the baseline Arm
  K (Welch''s p < 0.05 and mean loss > 0.15).

  '
hypothesis: 'Introducing a Probationary Warm-Up Period (WUP) of W = 100 steps for
  newly proposed dimensions, combined with a Predictability-Variance-Uniqueness (PVU)
  gating metric, will resolve the cold-start rejection bias in the Dual Control Categorizer.
  Specifically, under CLTS active control during the N=3 to N=4 object transition,
  this mechanism (Arm O) will successfully recruit the 4th dimension in at least 4
  out of 5 seeds (recruitment rate >= 80%), with the recruited dimension being non-collapsed
  (variance > 1e-3), highly predictable (relative prediction error U_new = MSE / Var
  < 0.5), and non-redundant (maximum absolute correlation with existing dimensions
  < 0.8). This will enable the network to successfully track the novel 4th object,
  reducing the post-transition centroid decoding MSE from 130.39 (Arm N) to below
  70.0, without increasing the test simulation loss above 0.15.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "1. Identify the dimension recruitment and MDL consistency gating\
  \ logic within `src/thalamus.py` and `src/models_dual_stream.py`.\n2. Implement\
  \ Arm O: \n   a. When a new dimension is proposed, set its state to `probationary=True`\
  \ and initialize a counter for W = 100 steps.\n   b. Allow the probationary dimension's\
  \ encoder and predictor weights to be updated via standard gradient descent during\
  \ training.\n   c. Prevent the probationary dimension from affecting attention routing\
  \ or triggering new proposals during these 100 steps.\n   d. At the end of the W\
  \ steps, evaluate the PVU criteria on the consistency buffer:\n      - Non-collapse:\
  \ Variance of the new dimension > 1e-3.\n      - Predictability: Relative prediction\
  \ error U_new = MSE / Var < 0.5.\n      - Uniqueness: Maximum absolute correlation\
  \ with existing dimensions < 0.8.\n   e. If all three criteria are met, accept and\
  \ integrate the dimension; otherwise, prune it.\n3. Implement Arm P (Control): Same\
  \ probationary warm-up period, but evaluates acceptance using the original total\
  \ simulation loss ratio `L_consistency = sim_new / sim_old < 1.0`.\n4. Run a 5-seed\
  \ comparative sweep across Arms K (Baseline), N (Original immediate MDL gate), O\
  \ (WUP-PVU), and P (WUP-MDL).\n5. Log and evaluate: Centroid decoding MSE, dimension\
  \ count, test simulation loss, soft spatial variance, and correlation statistics.\
  \ Conduct statistical significance tests (Welch's t-test and Levene's test) to validate\
  \ the hypothesis.\n"
