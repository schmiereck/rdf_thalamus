falsification_criterion: "The hypothesis is falsified if EITHER:\n(F1) Arm B (SFA+VICReg)\
  \ shows ΔR²_color ≤ 0.1812 (the VICReg-only baseline) when computed over\n     non-collapsed\
  \ seeds — meaning SFA adds no marginal identity-encoding benefit even on the\n \
  \    gradient-isolated separate-backbone architecture; OR\n(F2) Arm B shows collapse\
  \ rate > 10% (≥2 of 10 seeds) on the original seed bank — meaning SFA\n     destabilizes\
  \ the previously stable VICReg-only regime.\nEither outcome refutes the claim that\
  \ SFA constructively shapes z_dyn on this architecture.\n"
hypothesis: 'On the separate-backbone architecture (SeparateDynEncoder via NonParametricJEPASpatialSeparateDyn),

  adding an explicit SFA slowness term ||z_dyn(t) - z_dyn(t-1)||² to the VICReg-only
  z_dyn objective

  improves identity encoding as measured by ΔR²_color from a held-out linear probe,
  without introducing

  collapse on the hard-seed seed bank [7, 17, 31, 53, 71, 83, 97, 113, 127, 149].

  Specifically: Arm B (SFA+VICReg, sfa_weight=5.0, mask_dyn_sim=True) will show ΔR²_color
  > 0.1812

  (the VICReg-only baseline from iter_027 Arm C) when computed over non-collapsed
  seeds, AND will

  show collapse rate ≤ 10% on the same seed bank.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "Three-arm experiment on the original 10-seed bank [7, 17, 31, 53,\
  \ 71, 83, 97, 113, 127, 149]:\n\nArm A (Control — reuse iter_027 Arm C): Separate\
  \ backbone, primary_objective=\"jepa\",\n  mask_dyn_sim=True, var_weight=25, cov_weight=25,\
  \ sim_weight=1. This is VICReg-only on z_dyn.\n  Known result: 0% collapse, ΔR²_color=0.1812.\
  \ Data reused from iter_027.\n\nArm B (SFA+VICReg, primary): Separate backbone,\
  \ primary_objective=\"sfa\", mask_dyn_sim=True,\n  sfa_weight=5.0, var_weight=25,\
  \ cov_weight=25, sim_weight=1. This adds the SFA slowness term\n  to the VICReg-only\
  \ z_dyn objective, with JEPA prediction as a stop-gradient readout.\n  10 new runs\
  \ on the original seed bank.\n\nArm C (SFA+VICReg, conservative): Same as Arm B\
  \ but sfa_weight=1.0.\n  10 new runs on the original seed bank.\n  \nTotal new runs:\
  \ 20 (Arms B and C). Arm A data reused from iter_027.\n\nTraining: 8000 steps, batch_size=32,\
  \ lr=3e-4, d_t=3 (frozen), buffer=4000.\nArchitecture: NonParametricJEPASpatialSeparateDyn\
  \ (SeparateDynEncoder + DualStreamPredictor).\n\nEvaluation metrics per run:\n-\
  \ Collapse check: per-dim std of z_dyn (threshold 0.5) on both eval and train batches\n\
  - ΔR²_color: held-out linear probe predicting RGB color from z_dyn (identity encoding\
  \ quality)\n- Centroid MSE: Arm F soft-argmax position decoding (spatial encoding\
  \ quality)\n- mean_abs_corr: VICReg health metric on z_dyn\n- sfa_loss trajectory:\
  \ verify slowness term is active and decreasing\n- Per-seed outcomes with per-dim\
  \ std magnitudes for any collapses\n\nKey confounds to report:\n- SFA mode sets\
  \ var_loss_coord=0 and cov_loss_coord=0 (no VICReg on coord stream),\n  while the\
  \ JEPA-mode control gives coord stream full VICReg. This could affect z_coord\n\
  \  quality but NOT z_dyn quality, so ΔR²_color comparison remains fair.\n- \"0%\
  \ collapse\" under SFA+VICReg is expected (SFA + VICReg both encourage high std)\n\
  \  and is NOT the headline metric. The headline is ΔR²_color improvement.\n\nFiles\
  \ to create:\n- src/run_phase0_sfa_separate_backbone.py: experiment runner for Arms\
  \ B and C\n  (modeled after src/run_phase0_separate_dyn.py)\n\nFiles to reuse (unchanged):\n\
  - src/models_separate_dyn.py: NonParametricJEPASpatialSeparateDyn with mask_dyn_sim\
  \ support\n- src/models_dual_stream.py: NonParametricJEPASpatial with SFA mode\n\
  - src/environment.py: PhysicsSandbox\n"
