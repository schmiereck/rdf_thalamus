experimenter_view: 'The hypothesis was falsified by the pre-registered F1 gate: Arm
  B mean

  delta_R2_color = 0.2749, narrowly missing the 0.30 practical-significance

  threshold. However, the experiment produced important structural findings:

  (1) Zero collapse across all 60 runs (F2 PASS), confirming that adding an

  explicit SFA slowness term to VICReg does not destabilize the separate-

  backbone architecture. (2) Centroid MSE is virtually identical between Arm

  A and Arm B (159.83 vs 159.85; F3 PASS), so SFA does not trade away

  spatial readout quality. (3) Fresh seeds benefited more from SFA than

  original seeds (Arm B fresh=0.358, original=0.192), suggesting the effect

  is seed-distribution dependent. (4) The conservative Arm C (sfa=1.0)

  outperformed Arm B on both hard seeds (53 and 71), indicating diminishing

  or even negative returns at higher SFA weights for difficult initial

  conditions. Overall, SFA+VICReg on the separate backbone shows a trend

  toward improved identity encoding but fails to cross the pre-specified

  bar for practical significance. The null result is firmly established.

  '
