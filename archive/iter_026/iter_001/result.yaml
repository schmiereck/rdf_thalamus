experimenter_view: 'The iter_026 collapse-rate sweep completed all 50 runs (5 arms
  × 10 seeds) under the corrected dual-collapse protocol. No configuration achieved
  the pre-registered ≤10% collapse gate. Arm A1 (batch_size=64) produced the lowest
  dual-criterion collapse rate at 30% (vs. A0 canonical at 40%), suggesting larger
  batch size modestly improves VICReg stability, but the effect is insufficient to
  reach the target. Arm A4 (lr=1e-4) collapsed on 100% of seeds, confirming that 3e-4
  is near a stability boundary and lowering it further is harmful under this optimizer
  and step budget. The train-only criterion flagged fewer collapses than eval-only
  for most arms, indicating some runs that maintained training variance still failed
  to generalize at evaluation. All seeds passed the loss ≤ 50 sanity check. The measured
  null is robust: the swept single-knob variations do not contain a regime that beats
  the canonical baseline by the required margin.

  '
