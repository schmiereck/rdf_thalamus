experimenter_view: 'The pre-registered SA-CCR hypothesis is FALSIFIED.  Across 5 matched
  seeds,

  proportional surprise scaling of the CCR covariance weight (Arm L) does

  not significantly reduce post-collision centroid decoding MSE relative to

  the fixed baseline (Welch p=0.895), and inverse scaling (Arm M) is in

  fact equally good or better on both MSE and sim_loss — directly

  falsifying pre-registered criterion 4.  Proportional scaling also

  exhibits a destabilization mode (seed-456 sim_loss=73.97, d_t overshoots

  to 5), giving it a worse tail than the static baseline.


  The Strategic Manager''s structural alternative (Arm N: Surprise Detector

  + slow Categorizer with consistency buffer) produced a clean negative

  structural finding: the proposed consistency ratio L = sim_new/sim_old

  is mathematically incompatible with the model''s masked predictor head,

  because the cold dimension yields sim_new ≈ mse(0, target) in the

  thousands.  All 5 passive 2->3 transitions and all 31 active 3->4

  retries were rejected (ratios from 1.3e4 to 3.4e4), leaving Arm N stuck

  at d_t=3 and unable to track the novel 4th object (mean_var_3=33.78,

  mse_cent=130.39 vs the CCR arms'' ~64).  This is the kind of falsifiable,

  structural empirical regularity the Manager solicited: a vanilla MDL gate

  needs a predictor warm-up phase before it can possibly accept recruitment.


  Net: SA-CCR is a soft-patch null result; the Dual Control architecture

  needs a structural fix (warm the new dim before gating) before it can be

  fairly evaluated against the fixed-CCR baseline.

  '
