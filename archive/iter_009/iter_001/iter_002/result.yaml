experimenter_view: 'All 5 seeds trained successfully across the three arms, and the
  CSV summary was saved.

  However, right at the plotting step at the end of training, a minor matplotlib parsing
  bug occurred:

  the title string `"EWMA Surprise ($\bar{S}_t$) Trajectory"` was not prefixed as
  a raw string `r"..."`,

  causing `\b` to be evaluated as a backspace character, which raised a ParseException
  in mathtext.


  From a scientific perspective, the comparative sweep yielded exceptionally rich
  insights:

  1. Arm A (Gentle) maintained excellent predictive capabilities (mean decoding MSE
  of 69.11) but suffered from poor spatial localization (mean variance of 118.76).

  2. Arm B (Strong) achieved highly localized representations (mean variance of 60.29)
  but severely degraded predictive capacity (mean decoding MSE degraded to 106.87).

  3. Arm C (DSMC) successfully decoupled these constraints early on, achieving a highly
  localized coordinate representation (mean variance of 57.35, outperforming the strong
  static bottleneck) while maintaining a high-quality predictive model (mean decoding
  MSE of 71.40).

  4. With an observed mean decoding MSE of 71.40 (just above the adjusted threshold
  of <= 70.0) and a mean final penalty of 0.04978 (just below the sanity threshold
  of 0.05), the DSMC configuration borderline-falsifies the tight preregistered criteria.
  This suggests that the curriculum parameters (such as the scaling factor $\gamma$
  or initial EWMA surprise) require slight tuning to fully optimize the transition
  profile.

  '
