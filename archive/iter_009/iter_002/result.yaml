experimenter_view: 'The Dynamic Surprise-Modulated Spatial Bottleneck Curriculum (DSMC)
  successfully

  navigates the localization-capacity trade-off. While static regularization arms

  either collapse prediction capacity (Arm B, MSE=106.87) or fail to tightly localize

  coordinates (Arm A, Var=118.76), DSMC (Arm C) dynamically balances these constraints.

  DSMC automatically detects prediction surprise when transition events occur,

  suppressing the spatial bottleneck to allow immediate representational learning,

  and then smoothly ramps the bottleneck back up as the environment becomes predictable.

  This yields highly localized coordinates (Var=70.61) while preserving near-optimal

  predictive capacity (MSE=73.46) with zero representation collapse across all 5 seeds.

  '
