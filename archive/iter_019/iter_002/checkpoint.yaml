task: "## Phase 19 Experiment: ITAG (Input-Level Temporal AutoCorrelation Gating)\
  \ with Structured Distractor\n\n### CRITICAL: Read Pre-Registration First\nBefore\
  \ writing ANY code, read `src/pre_registration.md` and strictly adhere to the pre-registered\
  \ hypothesis, falsification criteria, and experimental protocol. Do NOT deviate\
  \ from the pre-registered plan.\n\n### Context\nThis is Phase 19 of the Thalamus\
  \ project. Phases 16-18 all failed to solve the dimension recruitment gating problem:\n\
  - WUP-MDL (Phase 16): 100% genuine recruitment, 100% false recruitment on Noisy-TV\n\
  - ESUG (Phase 17): Encoder cold-start caused rejection of genuine objects\n- EG-MDL\
  \ (Phase 18): Predictor cold-start optimization transient rendered ρ useless\n\n\
  ITAG is the fourth attempt. The Manager has explicitly noted that ITAG trivially\
  \ succeeds on Noisy-TV (by definition of white noise), so the real test is a STRUCTURED\
  \ DISTRACTOR that has high temporal autocorrelation but is not a physics object.\n\
  \n### Task: Implement and Run Full Phase 19 Experiments\n\nYou need to create 3\
  \ files and modify 1 file, then run the experiments.\n\n#### 1. CREATE src/itag.py\n\
  Implement ITAG (Input-level Temporal AutoCorrelation Gating) and ISAG (Input-level\
  \ Spatial AutoCorrelation Gating):\n\n```python\nimport numpy as np\nimport torch\n\
  \ndef identify_surprising_positions(prediction_error_map, top_k=16):\n    \"\"\"\
  \n    Identify top-K spatial positions with highest prediction error.\n    Args:\n\
  \        prediction_error_map: (B, 128) or (128,) - per-position prediction error\
  \ from the encoder\n        top_k: number of positions to select\n    Returns:\n\
  \        positions: list of indices into the 128-pixel array\n    \"\"\"\n    #\
  \ If batched, take mean across batch\n    if prediction_error_map.dim() == 2:\n\
  \        prediction_error_map = prediction_error_map.mean(dim=0)  # (128,)\n   \
  \ elif prediction_error_map.dim() == 3:\n        # (B, C, 128) -> take norm across\
  \ C, mean across B\n        prediction_error_map = prediction_error_map.norm(dim=1).mean(dim=0)\
  \  # (128,)\n    \n    _, top_indices = torch.topk(prediction_error_map, min(top_k,\
  \ prediction_error_map.shape[0]))\n    return top_indices.sort()[0].tolist()\n\n\
  def compute_itag(pixel_buffer, surprising_positions, window=20):\n    \"\"\"\n \
  \   Compute ITAG score: mean lag-1 temporal autocorrelation of raw pixel values\
  \ \n    at surprising positions over a sliding window.\n    \n    Args:\n      \
  \  pixel_buffer: list of length W_t, each element is (3, 128) numpy array\n    \
  \    surprising_positions: list of spatial indices\n        window: number of timesteps\
  \ to use (uses last `window` from buffer)\n    Returns:\n        itag_score: float\
  \ in [-1, 1]\n    \"\"\"\n    if len(pixel_buffer) < 2 or len(surprising_positions)\
  \ == 0:\n        return 0.0\n    \n    # Use last `window` timesteps\n    buffer_slice\
  \ = pixel_buffer[-window:]\n    if len(buffer_slice) < 2:\n        return 0.0\n\
  \    \n    # Stack into array: (T, 3, 128)\n    pixel_array = np.stack(buffer_slice,\
  \ axis=0)\n    T = pixel_array.shape[0]\n    \n    # Compute per-position temporal\
  \ autocorrelation\n    autocorrs = []\n    for pos in surprising_positions:\n  \
  \      if pos < 0 or pos >= 128:\n            continue\n        # Get pixel intensity\
  \ at this position across time (sum across RGB channels for robustness)\n      \
  \  # Shape: (T,)\n        pixel_vals = pixel_array[:, :, pos].sum(axis=1)  # (T,)\n\
  \        \n        # Compute lag-1 autocorrelation\n        if T < 2:\n        \
  \    autocorrs.append(0.0)\n            continue\n        \n        x_t = pixel_vals[:-1]\
  \  # (T-1,)\n        x_t1 = pixel_vals[1:]  # (T-1,)\n        \n        # Pearson\
  \ correlation between x_t and x_{t+1}\n        std_t = np.std(x_t)\n        std_t1\
  \ = np.std(x_t1)\n        \n        if std_t < 1e-8 or std_t1 < 1e-8:\n        \
  \    # Constant signal: high autocorrelation\n            autocorrs.append(1.0 if\
  \ np.mean(np.abs(x_t - x_t[0])) < 1e-6 else 0.0)\n            continue\n       \
  \ \n        corr = np.corrcoef(x_t, x_t1)[0, 1]\n        if np.isnan(corr):\n  \
  \          corr = 0.0\n        autocorrs.append(corr)\n    \n    if len(autocorrs)\
  \ == 0:\n        return 0.0\n    \n    return float(np.mean(autocorrs))\n\ndef compute_isag(pixel_buffer,\
  \ surprising_positions):\n    \"\"\"\n    Compute ISAG score: mean lag-1 spatial\
  \ autocorrelation of raw pixel values \n    at adjacent surprising positions, computed\
  \ per frame.\n    \n    Args:\n        pixel_buffer: list of (3, 128) numpy arrays\
  \ (single frame used from last)\n        surprising_positions: list of spatial indices\
  \ (sorted)\n    Returns:\n        isag_score: float in [-1, 1]\n    \"\"\"\n   \
  \ if len(pixel_buffer) == 0 or len(surprising_positions) < 2:\n        return 0.0\n\
  \    \n    # Use last frame\n    frame = pixel_buffer[-1]  # (3, 128)\n    \n  \
  \  # Sort positions\n    sorted_pos = sorted(surprising_positions)\n    \n    #\
  \ Compute spatial autocorrelation between adjacent surprising positions\n    spatial_corrs\
  \ = []\n    for i in range(len(sorted_pos) - 1):\n        pos_a = sorted_pos[i]\n\
  \        pos_b = sorted_pos[i + 1]\n        \n        if pos_a >= 128 or pos_b >=\
  \ 128:\n            continue\n        \n        # Pixel intensity (sum across RGB)\n\
  \        val_a = frame[:, pos_a].sum()\n        val_b = frame[:, pos_b].sum()\n\
  \        \n        # For spatial autocorrelation we need multiple adjacent pairs\n\
  \        # Since we only have one frame, compute correlation across the spatial\
  \ positions\n        # using a simpler approach: check if adjacent surprising positions\
  \ have similar intensity\n        # This is a proxy for spatial smoothness\n   \
  \     spatial_corrs.append(val_a * val_b)  # unnormalized similarity\n    \n   \
  \ if len(spatial_corrs) == 0:\n        return 0.0\n    \n    # Normalize: compare\
  \ actual similarity to expected if positions were independent\n    all_vals = [frame[:,\
  \ p].sum() for p in sorted_pos if p < 128]\n    if len(all_vals) == 0:\n       \
  \ return 0.0\n    \n    mean_val = np.mean(all_vals)\n    var_val = np.var(all_vals)\n\
  \    \n    if var_val < 1e-8:\n        return 1.0  # All positions same intensity\
  \ → perfectly smooth\n    \n    # Spatial autocorrelation (Moran's I style)\n  \
  \  n = len(sorted_pos)\n    w_sum = n - 1  # number of adjacent pairs\n    numerator\
  \ = sum((all_vals[i] - mean_val) * (all_vals[i+1] - mean_val) \n               \
  \     for i in range(len(all_vals)-1))\n    denominator = var_val * w_sum\n    \n\
  \    if abs(denominator) < 1e-8:\n        return 0.0\n    \n    isag = numerator\
  \ / denominator\n    return float(np.clip(isag, -1.0, 1.0))\n```\n\n#### 2. MODIFY\
