experimenter_view: 'The Phase 19 experiment script was successfully implemented and
  executed, completing all 45 runs (5 seeds × 3 arms × 3 sweeps). However, a critical
  logic bug was discovered post-hoc: Arm A (WUP-MDL Baseline) was incorrectly subjected
  to the ITAG pre-filter because both Arm A and Arm B share gating="mdl", and the
  code used gating rather than arm_name to distinguish them. Consequently, Arm A was
  rejected whenever ITAG ≤ 0.3 instead of proceeding to WUP probation unconditionally.
  This invalidates the baseline comparison and the falsification audit results. The
  ITAG scores themselves were unexpectedly low/negative for genuine transitions and
  mixed for distractors, suggesting the encoder''s surprising positions do not align
  with object locations in a way that produces meaningful temporal autocorrelation.
  After fixing the Arm A logic, the experiment should be re-run to obtain valid baseline
  comparisons.

  '
