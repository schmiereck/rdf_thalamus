experimenter_view: 'The pass-through physics sandbox correctly disables object-object
  collisions while preserving pointer-object elastic collisions. However, removing
  inter-object collisions alone does not make perception-driven targeting load-bearing.
  In the 1D bounded arena, the passive pointer naturally bounces off walls and encounters
  objects frequently, accumulating a mean of 12.27 valid collisions per object (well
  above the <3.0 gate). This empirically confirms that spatial pass-through is insufficient
  to constrain passive information flow; foveated-gaze or occlusion mechanisms are
  required to force active targeting for mass estimation.

  '
