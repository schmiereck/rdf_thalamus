task: "You are executing Part B of iter_031: Protocol Calibration for CLTS evaluation.\n\
  \nREAD src/pre_registration.md FIRST — you must adhere to the pre-registered Part\
  \ B gates and margin formulas.\n\n## Objective\nCalibrate the CLTS (Closed-Loop\
  \ Thalamic Subsumption) evaluation protocol by measuring random/frozen baselines\
  \ FIRST, then testing whether surprise-driven attention exceeds those baselines\
  \ by pre-declared margins.\n\n## Context\nIn iter_030 ARM 1, all integration gates\
  \ failed because of ceiling effects: with N=3 objects in 128 pixels, collisions\
  \ occur every 2-3 steps, making ANY attention channel \"collision-involved\" (switch\
  \ rate ≈1.0 for random). The 20px tracking gate was also uncalibrated. This protocol\
  \ calibration fixes both problems by using N=2 collision-sparse environments and\
  \ pre-registering gates relative to MEASURED random baselines.\n\n## Implementation\
  \ Plan\n\n### Step 1: Create the evaluation script src/run_iter031_partB.py\n\n\
  The script should:\n\n**B1: N=2 Collision-Sparse CLTS Evaluation**\n\n1. Load an\
  \ existing VICReg-only model checkpoint (use the separate-backbone model architecture\
  \ from models_separate_dyn.py with mask_dyn_sim=True, coord_vicreg=True). If no\
  \ checkpoint exists from iter_029, create a fresh model and train it briefly (2000\
  \ steps) to have a working representation.\n\n2. Create N=2 PhysicsSandbox environments\
  \ with collision-sparse settings (larger gaps between objects, or use seed-based\
  \ variation).\n\n3. For each of 5 seeds [7, 31, 97, 113, 137], run 3 conditions:\n\
  \   - **surprise-driven**: Use the CLTSMotorController from src/motor.py to drive\
  \ attention by surprise signal\n   - **frozen**: Fix attention at locus=0 (always\
  \ attend channel 0)\n   - **random**: At each step, randomly choose an attention\
  \ channel\n\n4. For each condition, run 2000 evaluation steps, measuring:\n   -\
  \ **Tracking error**: Mean absolute error between pointer position and attended\
  \ channel centroid\n   - **Collision count per 100 steps**: How often do collisions\
  \ occur?\n   - **Collision attention selectivity**: Fraction of post-collision steps\
  \ (within 15-step window after collision) where the colliding object's channel is\
  \ attended\n   - **Total steps evaluated**: Should be 2000\n\n5. Report the measured\
  \ random/frozen baselines EXPLICITLY.\n\n6. Apply pre-registered gates (using measured\
  \ random baselines):\n   - G1_tracking: surprise-driven tracking error ≤ random_tracking_mean\
  \ − 1*random_tracking_std\n   - G2_collision_selectivity: surprise-driven collision\
  \ selectivity ≥ random_selectivity × 1.5\n   - G3_perturbation_selectivity (from\
  \ B2 below)\n\n**B2: Subtle Mass Perturbation Test**\n\n1. In the same N=2 environment,\
  \ at step 1000: multiply mass of object 0 by 1.5× (NOT 10× — we want subtle perturbation).\n\
  \n2. Measure **perturbation attention selectivity**: fraction of steps in the 100-step\
  \ window post-perturbation (steps 1000-1099) where the changed object's channel\
  \ is attended.\n\n3. Apply gate: surprise-driven perturbation selectivity ≥ random_selectivity\
  \ × 1.5\n\n### Step 2: Run the evaluation\n\nRun all 5 seeds × 3 conditions = 15\
  \ evaluation runs.\n\n### Step 3: Analyze results\n\n- Compute mean and std of tracking\
  \ error, collision selectivity, perturbation selectivity for each condition\n- Report\
  \ measured random baselines explicitly\n- Apply pre-registered gates G1-G3\n- Write\
  \ analysis to archive/iter_031/results/partB_analysis.md\n\n## Key Files to Reference\n\
  - src/pre_registration.md — pre-registered Part B gates\n- src/motor.py — CLTSMotorController\n\
  - src/environment.py — PhysicsSandbox (check for N parameter and mass modification)\n\
  - src/models_separate_dyn.py — NonParametricJEPASpatialSeparateDyn\n- src/train_eval_closed_loop.py\
  \ — existing closed-loop evaluation code (REFERENCE for how CLTS evaluation works)\n\
  - src/run_arm1_integration_smoke_test.py — iter_030 ARM 1 evaluation (reference\
  \ for the ceiling-effect problem)\n\n## Important Notes\n- N=2 is critical to avoid\
  \ the collision ceiling effect from iter_030\n- The mass perturbation should be\
  \ SUBTLE (1.5×) not dramatic (10×) — we want to test sensitivity, not obvious detection\n\
  - For the surprise-driven condition, use the CLTSMotorController's attention mechanism\
  \ with the surprise signal from the model\n- If CLTSMotorController doesn't support\
  \ N=2 or there are interface issues, adapt accordingly but document any changes\n\
  - The frozen condition (locus=0) provides a lower bound; random provides the chance-level\
  \ baseline\n- Pre-register the margin formulas BEFORE computing results (already\
  \ done in pre_registration.md)"
