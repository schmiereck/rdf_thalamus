experimenter_view: 'The calibration sweep demonstrates that a collision-sparse, N=2
  environment successfully reveals directional signal for active surprise-driven attention
  over random attention in matching tracking settings (collision selectivity V-B increases
  from 0.44 to 0.59). However, all pre-registered gates failed because of representation-level
  spatial misalignment in the underlying VICReg checkpoint (which introduces high
  tracking error) and the subtle nature of the 1.5x mass perturbation which did not
  trigger a sufficient surprise gradient in the dynamics network. We recommend using
  matching tracking dimension (d_t = N = 2) for future evaluations and incorporating
  SFA-trained or reconstruction-trained representation backbones to bypass spatial
  misalignment constraints.

  '
