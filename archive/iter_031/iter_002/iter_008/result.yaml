experimenter_view: "Single-seed benchmark (seed=7, 1 worker) completed all 3 arms\
  \ × 8000 steps \nin ~9.5 minutes on CPU. Arm A (d_max=8, trained) shows strong VICReg\
  \ \nregularization (per_dim_std > 1.0) but negative ΔR²_color (-0.394), failing\
  \ \nthe F1 ceiling gate of 0.30. Arm B (d_max=2, trained) achieves near-zero \n\
  ΔR²_color (-0.006) — reconstruction+VICReg does not encode color identity. \nArm\
  \ C (d_max=8, random-encoder) collapsed (per_dim_std ≈ 0.001), which is \nexpected\
  \ for a random encoder that cannot structure its latents. The \nper-step logging\
  \ (~7800 lines per arm) adds overhead; timing suggests \n~2.4 steps/second overall.\n"
