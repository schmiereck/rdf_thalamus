experimenter_view: 'The full 60-run production suite (3 arms × 20 seeds) completed
  without worker

  crashes. All four pre-registered falsification gates (F1–F4) FAILED.

  Arm A (d_max=8, trained) achieved mean ΔR²_color = 0.063 ± 0.173, far below

  the 0.30 ceiling and with a 95% CI lower bound of −0.013. Arm B (d_max=2)

  performed similarly (mean = 0.027), so the capacity margin (F3) was only

  0.036—well under the 0.10 threshold. Arm C (random encoder) collapsed on

  all 20 seeds (100% collapse rate), making F4 uncomputable (NaN). The key

  finding is that even a supervised pixel-reconstruction objective cannot push

  the mean-readout z_dyn stream to encode color identity above the 0.30

  threshold. The bottleneck appears to be the readout architecture itself,

  not objective class or capacity. Training is necessary to prevent collapse

  (Arms A & B: 0% collapse vs Arm C: 100%), but it is not sufficient to

  achieve the target identity-encoding ceiling.

  '
