  \ script (ARM definitions, training loop, replay buffer,\nVICReg + reconstruction\
  \ loss, semantic probing with Hungarian matching,\ncentroid MSE evaluation, and\
  \ the pre-registered analysis generator) is\nsound and follows the patterns established\
  \ in prior iterations (e.g.,\nrun_phase0_separate_dyn.py, run_phase0_sfa_separate_backbone.py).\n"
