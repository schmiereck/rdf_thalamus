experimenter_view: 'The SFA weight sweep falsified the hypothesis that increasing
  sfa_weight

  would produce delta_R2_color >= 0.10 over the A1 baseline. The blocking

  factor is C5 (SFA effectiveness): normalized_dyn_var decreases with higher

  sfa_weight (0.0086 -> 0.0011) but normalized_coord_var is near-zero across

  all arms, so the C5 inequality is never satisfied. Arm B (d_max=16) shows

  the highest absolute dR2_color (0.1374) and best tracking correlations,

  suggesting channel expansion helps, but still falls short of the threshold.

  Collapse is moderate (20-60%) and the ramp strategy (A6) mitigates it

  effectively (1/5 collapsed), yet does not improve color disentanglement.

  The SFA-VICRes conflict remains unresolved in this architecture.

  '
