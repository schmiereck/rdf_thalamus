experimenter_view: 'Adding explicit pixel-position encodings (Linear or Sinusoidal)
  to the convolutional

  backbone under CLTS did NOT mitigate the active-perception representational drift

  observed in Phase 12. With matched 5-seed sweeps trained independently from step
  1

  (different input channel counts: 3 for G, 4 for H, 7 for I), all three arms exceeded

  the pre-registered MSE-centroid bound of 75.0 (G=85.8, H=87.5, I=88.1) and exceeded

  the post-collision sim-loss bound of 0.050 (G=0.048 just under, H=0.059, I=0.091),

  triggering falsification under Criteria 1 and 3. Arm H additionally breached the

  soft-variance bound (10.71 > 10.0) -> Criterion 2 falsified. Criterion 4 is the
  only

  one not falsified: although Arm H and Arm I have higher mean test sim losses than

  Arm G, the Welch t-test p-values (0.553 / 0.150) do not reach statistical

  significance with n=5 seeds, so we cannot reject non-inferiority. However, the

  effect direction is consistently in the wrong direction (H and I are worse, not

  better), and the variance for Arm I is substantially larger (std 0.050 vs 0.031).

  Strategic interpretation: the explicit positional channels do not yield the

  hypothesized improvement; if anything Sinusoidal encoding (Arm I) degrades both

  predictive integrity and online training AUC (online_auc_1501_3000 ~10,000 vs

  ~5,800 for baseline). The Phase 13 hypothesis is FALSIFIED.

  '
log_excerpt: "Two-sample two-sided Welch's t-test:\n  Arm G vs Arm H: t = -0.6211,\
  \ p-value = 0.552909\n  Arm G vs Arm I: t = -1.6260, p-value = 0.149724\nLevene's\
  \ test (equality of variances):\n  Arm G vs Arm H: W = 0.0263, p-value = 0.875266\n\
  \  Arm G vs Arm I: W = 0.7268, p-value = 0.418704\nCriterion 1 (Coordinate Accuracy)\
  \ - Arm H MSE 87.50 / Arm I MSE 88.11 (threshold < 75.0) -> FALSIFIED\nCriterion\
  \ 2 (Spatial Tightness)   - Arm H Soft Var 10.71 (threshold < 10.0) -> FALSIFIED;\
  \ Arm I 6.83 -> OK\nCriterion 3 (Predictive Integrity)- Arm H sim_loss 0.0593 /\
  \ Arm I 0.0911 (threshold < 0.050) -> FALSIFIED\nCriterion 4 (Generalization)  \
  \    - t-test p > 0.05 in both directions -> VALIDATED (non-inferiority not statistically\
  \ rejected)\nOVERALL HYPOTHESIS: FALSIFIED\nSaved archive/iter_013/results/summary_phase13.csv\n\
  Saved archive/iter_013/results/auc_recovery_curves_phase13.png\nSaved archive/iter_013/results/audit_results_phase13.json\n"
