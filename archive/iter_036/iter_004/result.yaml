experimenter_view: 'The benchmark executed successfully after fixing three minor bugs
  (attribute init order,

  probe budget test equality, sanity dict unpacking). However, both Arm A (normal
  obj-obj)

  and Arm B (pass-through obj-obj) failed the CV gate. Under RANDOM condition, probe

  events were distributed too uniformly across objects (CV < 0.5), failing to establish

  a heterogeneous baseline necessary for the ORACLE superiority hypothesis test.

  The foveated gaze radius of 8 with 20 probes results in a relatively flat coverage

  distribution. Future iterations should consider a tighter foveation radius or stricter

  budget to force selectivity.

  '
