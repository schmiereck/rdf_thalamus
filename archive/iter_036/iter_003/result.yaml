experimenter_view: 'Fixed five critical bugs in src/run_iter036_benchmark.py without
  executing:

  1. Δv now computed across the full physics substep loop (pre-step → post-step) rather
  than just the immediate collision, by introducing _pending_probe_events that capture
  pre-step velocities and are finalized after the substep loop.

  2. CV gate now uses per-object probe-event counts from RANDOM runs (std/mean across
  3 objects, averaged over seeds) with threshold CV ≥ 0.5 and mean ≥ 0.5.

  3. Sanity checks replaced with pre-registered S1–S6, including per-object probe
  counts, success rate, informative-event fraction, coverage balance, in-bounds fraction,
  and minimum per-object share.

  4. ORACLE probe trigger now explicitly checks gaze_radius in addition to PROBE_ERROR_THRESH.

  5. probe_attempts and probe_hits tracking aligned with S2 definition.

  '
