experimenter_view: 'The decision-support package for iter_037 was completed. It synthesizes

  the pre-registration, gate results (CSV), and four-iteration null finding.

  Gate-1 (PASSIVE Boundedness) passed 5/5 seeds, confirming 2D removes

  collision inevitability. Gate-1b (Collision Heterogeneity) failed 3/5,

  not because collisions were too uniform, but because they were too rare

  for the CV metric to be stable (a consequence of Gate-1 "passing too well").

  Gate-2 (Random Gaze Heterogeneity) failed 1/5, with CV values clustering

  around the Poisson baseline (~0.39) rather than achieving the 0.50 threshold.

  The document explicitly rejects option (iii) decoder relaxation as

  mis-targeted and outlines path (i) vs (ii) trade-offs for the human researcher.

  '
