experimenter_view: 'Phase 17 ESUG experiment completed with a clear FALSIFIED verdict
  on both ESUG arms.


  KEY FINDING - Root Cause of ESUG Failure: The lambda (temporal roughness) metric

  is fundamentally incompatible with the cold-encoder evaluation paradigm. When the

  encoder''s 4th-dimension head is newly initialized (random weights), its output

  exhibits high temporal roughness (lambda ~1.0-1.5), far exceeding the 0.5 threshold.

  Only after substantial training does the encoder smooth out and produce low-lambda

  signals (as seen in seed 42 where lambda=0.13 after coincidental early convergence).

  This is the exact mirror of WUP-MDL''s cold-predictor problem: ESUG replaces

  "predictor cold-start rejection" with "encoder cold-start rejection."


  COMPARATIVE RESULTS:

  - WUP-MDL (Arm P): 5/5 recruitment, MSE=57.34, but 5/5 false recruitment in control

  - ESUG-100 (Arm Q): 1/5 recruitment, MSE=82.83, 1/5 false recruitment in control

  - ESUG-30 (Arm Q_fast): 1/5 recruitment, MSE=185.95, 1/5 false recruitment in control


  ESUG''s sole success (seed 42) occurred because the encoder''s 4th-dim head

  happened to converge quickly enough for lambda to drop below 0.5 within 100 steps.

  In all other seeds, the encoder needed more training before producing smooth signals,

  but ESUG''s evaluation window cut off the evaluation before convergence.


  SPECIFICITY ADVANTAGE: ESUG correctly rejected Noisy-TV in 4/5 control seeds

  (vs WUP-MDL''s 0/5), because Noisy-TV produces genuinely high-lambda signals.

  However, the single false recruitment (seed 42) reveals that even ESUG can be

  fooled when the encoder head coincidentally produces smooth outputs for a

  non-physical signal early in training.


  POST-RECRUITMENT STABILITY: The one seed where ESUG recruited (seed 42) showed

  lower attention switch rate (0.0303 vs 0.0566) and lower centroid tracking error

  (55.68 vs 59.38) compared to Arm P, suggesting that when ESUG does accept,

  the cold-predictor start may actually produce more stable initial control.

  However, n=1 makes this observation non-significant.


  CONCLUSION: ESUG''s encoder-only evaluation criterion trades one cold-start

  bias (predictor) for another (encoder). The lambda metric needs either a

  much longer evaluation window or an adaptive threshold that accounts for

  the encoder''s training dynamics.

  '
