experimenter_view: 'The iter_028 experiment completed all 40 seeds (13 resumed + 27
  new) with zero

  timeouts. The key finding is that mask_dyn_sim applied post-forward on the

  shared backbone does NOT eliminate z_dyn collapse. C1 (primary arm) showed

  20% collapse (2/10 seeds), which is not meaningfully different from D0''s

  30% (3/10) at this sample size. However, C2 (fresh seeds) achieved 0%

  collapse, revealing that collapse is highly seed-dependent. C3 (perturbed

  weights) also showed 20% collapse, indicating the result is not weight-robust.

  Notably, C1 showed dramatically improved semantic encoding quality versus D0

  (mean_abs_corr 0.52 vs 0.99, delta_R2_color 0.23 vs 0.05), suggesting that

  mask_dyn_sim improves representation quality when collapse does not occur,

  but cannot prevent the collapse mode itself on the shared backbone. The

  separate-dyn architecture appears to be the critical factor for collapse

  elimination, not the loss adjustment alone. Outcome: F1 FALSIFIED, F2 not

  triggered, F3 NOT ROBUST.

  '
