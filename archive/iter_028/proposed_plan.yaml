falsification_criterion: "Four independent falsification conditions, any one of which\
  \ refutes the hypothesis\nor downgrades its interpretation:\n\nF1: C1 collapse rate\
  \ ≥ 0.20 (dual criterion) → mask_dyn_sim alone is insufficient\n    on the shared\
  \ backbone; the separate-backbone architecture was load-bearing.\n    The Arm C\
  \ signal from iter_027 collapses to that confound.\n\nF2: C2 collapse rate ≥ 0.20\
  \ (fresh seed bank) → the C1 result is seed-dependent,\n    not general.\n\nF3:\
  \ C3 collapse rate ≥ 0.20 (±10% weight perturbation) → the C1 result is not\n  \
  \  robust to reasonable hyperparameter variation.\n\nF4: C1 passes the std gate\
  \ (C_C1 ≤ 0.10) BUT (ΔR²_C1 < D0_ΔR²_color + 0.05 OR\n    mean_abs_corr_C1 > mean_abs_corr_D0\
  \ + 0.05) → VICReg-maintained variance is\n    constructional; z_dyn has variance\
  \ but no meaningful semantic content\n    improvement over the collapsing baseline.\n\
  \nAdditional guard: D0 (shared-backbone JEPA+VICReg baseline replication) serves\n\
  as the in-iteration null reference. If D0 collapse rate < 0.20, the report must\n\
  note that the cov_weight=1 setting may contribute to reduced collapse (confound\n\
  awareness). D0 ΔR² and mean_abs_corr are the baselines for F4 and H2 gates.\n\n\
  Sample-size caveat: Fisher's exact test for 0/10 vs 3/10 gives p ≈ 0.21; the\ndesign\
  \ cannot formally distinguish 0% from 10–20% at this sample size. Results\nare reported\
  \ as point estimates with this limit explicitly noted.\n\nLanguage constraints:\
  \ Use \"does not destabilize VICReg-maintained variance\" or\n\"is consistent with\"\
  ; do NOT use \"breakthrough\", \"causal driver\", \"eliminated\",\n\"BEST\", \"\
  proves\", \"demonstrates\", or \"resolves.\"\n"
hypothesis: "Removing the JEPA similarity loss gradient on z_dyn (mask_dyn_sim=True)\
  \ from the\nshared-backbone NonParametricJEPASpatial encoder does not destabilize\
  \ the\nVICReg-maintained per-dimension variance of z_dyn, AND z_dyn retains meaningful\n\
  identity encoding as measured by an independent (non-VICReg-enforced) readout.\n\
  \nFormally: Let C_C1 be the dual-criterion collapse rate of arm C1 (shared backbone,\n\
  mask_dyn_sim=True, weights 25/25/1) over 10 seeds. Let ΔR²_C1 be the mean\ndelta_R2_color\
  \ of C1 across non-collapsed seeds. The hypothesis is:\n(H1) C_C1 ≤ 0.10 (std-based\
  \ collapse gate)\n(H2) ΔR²_C1 ≥ D0_ΔR²_color + 0.05 AND mean_abs_corr_C1 ≤ mean_abs_corr_D0\
  \ + 0.05\n     (C1 outperforms D0 on independent readouts relative to in-iteration\
  \ null)\n\nBoth conditions must hold. This is the critical isolate that iter_027's\
  \ Arm C\ncould not provide (it confounded separate-backbone with mask_dyn_sim).\n\
  \nConstructional acknowledgment: VICReg's variance hinge (γ - std, hinge at γ=1)\n\
  directly enforces per-dimension std ≥ 1, which trivially satisfies the collapse\n\
  gate (std < 0.5). Even a fully-confirmed C1+C2+C3 result will be reported as\n\"\
  removing sim_loss_dyn from the z_dyn gradient path does not destabilize\nVICReg-maintained\
  \ variance\" — NOT as \"sim_loss_dyn causes collapse.\"\n\nPre-declared 2×2 prediction\
  \ table (loss-competition hypothesis):\n|                      | sim_dyn ON    \
  \   | sim_dyn MASKED       |\n|----------------------|------------------|----------------------|\n\
  | Shared backbone      | ~30% (D0, conf.) | ≤10% (C1, predicted) |\n| Separate backbone\
  \    | ~30% (027 B)     | ~0% (027 C, conf.)   |\n\nIf C1 ≥ 20%: the separate backbone\
  \ was load-bearing after all; hypothesis refuted.\n"
pre_registration_file: src/pre_registration.md
proposed_method: "RESUME the pre-registered iter_028 experiment (same C1/C2/C3/D0\
  \ matrix, same\nhyperparameters). Do NOT redesign. 13/40 runs are already complete;\
  \ 27 remain.\n\nStep 1: MODIFY src/run_phase0_mask_dyn_sim_shared.py to add resume\
  \ logic and\nper-seed timeouts:\n(a) Before running each (arm, seed), check if the\
  \ corresponding JSON result file\n    already exists in archive/iter_028/results/runs/.\
  \ If it exists and is valid\n    (contains \"arm\" and \"seed\" keys), skip that\
  \ seed — load the result from the\n    existing JSON instead.\n(b) Wrap each seed's\
  \ training+evaluation in a per-seed timeout (600 seconds = 10\n    minutes, generous\
  \ for 8000 steps). If a seed times out, log it as a failed\n    seed (mark collapsed=True,\
  \ disqualified=True, with a timeout flag) and move on.\n(c) Collect both new results\
  \ and existing results into the final DataFrame.\n(d) The existing results_dir is\
  \ archive/iter_028/results/ — keep writing there.\n\nStep 2: RUN remaining 27 seeds:\n\
  - C1 remaining: seeds 53, 71, 83, 97, 113, 127, 149 (7 seeds)\n- C2 all: seeds 101,\
  \ 103, 107, 109, 131, 137, 139, 151, 157, 163 (10 seeds)\n- C3 all: seeds 7, 17,\
  \ 31, 53, 71, 83, 97, 113, 127, 149 (10 seeds)\nUse parallel execution (--workers\
  \ flag, default min(cpu_count-1, 4)) for speed,\nnot --sequential (which was the\
  \ source of the taskkill problem).\n\nStep 3: After all 40 runs are accounted for\
  \ (new + resumed), generate the final\nanalysis using the existing _generate_analysis()\
  \ function. The analysis includes:\n- Per-arm collapse rates (dual criterion: eval\
  \ OR train per-dim std < 0.5)\n- Per-seed train-vs-eval std gap table\n- Gate check\
  \ (C1, C2, C3 ≤ 10%)\n- D0 vs C1 relative-threshold comparison (ΔR² and mean_abs_corr)\n\
  - Pre-registered outcome classification (F1-F4 / H1+H2)\n- Parameter count comparison\n\
  - Sample-size caveat\n\nStep 4: UPDATE src/pre_registration.md with the final plan\
  \ (including 2×2 prediction\ntable and resume details).\n\nFILES TO MODIFY:\n- src/run_phase0_mask_dyn_sim_shared.py:\
  \ add resume logic + per-seed timeout\n- src/pre_registration.md: update with resume\
  \ plan and 2×2 prediction table\n\nFILES NOT TO MODIFY:\n- src/models_dual_stream.py\
  \ (mask_dyn_sim handled in runner, not model)\n- src/models_separate_dyn.py (not\
  \ needed for this experiment)\n- src/environment.py\n\nTotal runs: 4 arms × 10 seeds\
  \ = 40 (13 existing + 27 new).\nExisting D0 results: 10/10, collapse rate 30% (seeds\
  \ 17, 53, 83 collapsed).\nExisting C1 results: 3/10, collapse rate 0% (seeds 7,\
  \ 17, 31 — all non-collapsed).\nExpected wall time for 27 new runs: ~25-35 minutes\
  \ with parallel workers.\n"
