falsification_criterion: "Four independent falsification conditions, any one of which\
  \ refutes the hypothesis\nor downgrades its interpretation:\n\nF1: C1 collapse rate\
  \ ≥ 0.20 (dual criterion) → mask_dyn_sim alone is insufficient\n    on the shared\
  \ backbone; the separate-backbone architecture was load-bearing.\n    The Arm C\
  \ signal from iter_027 collapses to that confound.\n\nF2: C2 collapse rate ≥ 0.20\
  \ (fresh seed bank) → the C1 result is seed-dependent,\n    not general.\n\nF3:\
  \ C3 collapse rate ≥ 0.20 (±10% weight perturbation) → the C1 result is not\n  \
  \  robust to reasonable hyperparameter variation.\n\nF4: C1 passes the std gate\
  \ (C_C1 ≤ 0.10) BUT ΔR²_C1 < 0.05 → the VICReg-maintained\n    variance is constructional;\
  \ z_dyn has variance but no semantic content. The\n    mechanism is downgraded regardless\
  \ of the std-collapse numbers. Only if C1\n    passes BOTH the std gate AND the\
  \ independent readout does the iter_029\n    promotion to M2-style SFA-on-z_dyn\
  \ become justified.\n\nAdditional guard: D0 (shared backbone, mask_dyn_sim=False,\
  \ weights 25/25/1).\nIf D0 collapse rate < 0.20, then the cov_weight change (25→1)\
  \ alone reduces\ncollapse, confounding the C1 attribution. The report must state\
  \ this.\n"
hypothesis: 'Removing the JEPA similarity loss gradient on z_dyn (mask_dyn_sim=True)
  from the

  shared-backbone NonParametricJEPASpatial encoder does not destabilize the

  VICReg-maintained per-dimension variance of z_dyn, AND z_dyn retains meaningful

  identity encoding as measured by an independent (non-VICReg-enforced) readout.


  Formally: Let C_C1 be the dual-criterion collapse rate of arm C1 (shared backbone,

  mask_dyn_sim=True, weights 25/25/1) over 10 seeds. Let ΔR²_C1 be the mean

  delta_R2_color of C1 across non-collapsed seeds. The hypothesis is:

  (H1) C_C1 ≤ 0.10 (std-based collapse gate)

  (H2) ΔR²_C1 ≥ 0.10 (independent semantic readout gate)


  Both conditions must hold. This is the critical isolate that iter_027''s Arm C

  could not provide (it confounded separate-backbone with mask_dyn_sim).


  Constructional acknowledgment: VICReg''s variance hinge (γ - std, hinge at γ=1)

  directly enforces per-dimension std ≥ 1, which trivially satisfies the collapse

  gate (std < 0.5). Even a fully-confirmed C1+C2+C3 result will be reported as

  "removing sim_loss_dyn from the z_dyn gradient path does not destabilize

  VICReg-maintained variance" — NOT as "sim_loss_dyn causes collapse."

  '
pre_registration_file: src/pre_registration.md
proposed_method: "Step-by-step experimental protocol:\n\n1. CREATE src/run_phase0_mask_dyn_sim_shared.py\
  \ — the experiment runner.\n   Based on run_phase0_separate_dyn.py, simplified to\
  \ shared-backbone only.\n   Implements mask_dyn_sim via loss adjustment after forward():\n\
  \     adjusted_loss = loss_dict[\"loss\"] - sim_weight * loss_dict[\"sim_loss_dyn\"\
  ]\n   This is identical to NonParametricJEPASpatialSeparateDyn's approach.\n   No\
  \ modification to models_dual_stream.py.\n\n2. FOUR ARMS (10 seeds each, 40 total\
  \ runs):\n\n   D0 — Weight-change anchor (shared backbone, mask_dyn_sim=False, weights\
  \ 25/25/1):\n     NonParametricJEPASpatial, dyn_readout=\"mean\", d_max=8, d_t=3,\n\
  \     pos_encoding=\"none\", primary_objective=\"jepa\", lr=3e-4, batch_size=64,\n\
  \     buffer=4000, 8000 steps, gradient clipping max_norm=1.0,\n     ccr_mode=\"\
  covariance\", ccr_smooth_weight=10, ccr_spatial_weight=10,\n     gdasr_log_only=True,\
  \ sim_weight=25, var_weight=25, cov_weight=1,\n     seeds=[7, 17, 31, 53, 71, 83,\
  \ 97, 113, 127, 149].\n     Purpose: Establish shared-backbone collapse rate with\
  \ cov_weight=1.\n     If D0 ≈ 30-40% (like iter_027), the weight change alone doesn't\
  \ help.\n\n   C1 — Primary arm (shared backbone, mask_dyn_sim=True, weights 25/25/1):\n\
  \     Same as D0 but mask_dyn_sim=True. Same seeds.\n     The critical isolate:\
  \ does removing sim_loss_dyn prevent collapse\n     without the separate-backbone\
  \ confound?\n\n   C2 — Seed robustness (shared backbone, mask_dyn_sim=True, weights\
  \ 25/25/1):\n     Same as C1 but fresh seed bank: [101, 103, 107, 109, 131, 137,\
  \ 139,\n     151, 157, 163]. Tests whether C1's result is seed-dependent.\n\n  \
  \ C3 — Weight robustness (shared backbone, mask_dyn_sim=True, weights 27.5/27.5/1.1):\n\
  \     Same as C1 but var_weight=27.5, cov_weight=1.1 (+10% perturbation).\n    \
  \ Original seeds. Tests sensitivity to weight variation.\n\n3. EVALUATION at step\
  \ 8000 (same protocol as iter_027):\n   - Dual collapse criterion: collapsed_eval\
  \ OR collapsed_train (per-dim std < 0.5)\n   - Train-vs-eval std gap: report per-seed,\
  \ co-equally with collapse rates\n   - Hungarian-primary matching for semantic probes\n\
  \   - Semantic probes: delta_R2_color (INDEPENDENT READOUT, pre-declared gate ≥0.10),\n\
  \     r2_dyn_color, r2_coord_color, r2_dyn_pos, r2_coord_pos,\n     r2_dyn_identity,\
  \ delta_r2_identity\n   - VICReg health: per_dim_std, mean_abs_corr\n   - Centroid\
  \ MSE (reference only, NOT used for arm selection)\n   - Training loss sanity: mean\
  \ total loss at step 8000, loss > 50 → disqualified\n   - Parameter count per arm\
  \ (logged before runs start)\n\n4. STOP RULE: All 40 runs complete. No early termination.\n\
  \n5. PRE-REGISTERED OUTCOME CLASSIFICATION:\n   - If C1 ≤ 10% AND ΔR²_C1 ≥ 0.10:\
  \ CONFIRMED — mask_dyn_sim on shared\n     backbone does not destabilize VICReg-maintained\
  \ variance AND preserves\n     semantic encoding. Promotion to M2-style SFA (iter_029)\
  \ is justified.\n   - If C1 ≥ 20%: FALSIFIED — mask_dyn_sim alone insufficient;\
  \ separate\n     backbone was load-bearing.\n   - If C1 ≤ 10% BUT ΔR²_C1 < 0.05:\
  \ DOWNGRADED — VICReg variance is\n     constructional; no semantic content despite\
  \ maintained variance.\n   - If C2 ≥ 20%: SEED-DEPENDENT — C1 result does not generalize.\n\
  \   - If C3 ≥ 20%: NOT ROBUST — C1 result sensitive to weight perturbation.\n\n\
  6. LANGUAGE CONSTRAINTS (tracked failure mode from iter_027 overclaim):\n   - Use\
  \ \"does not destabilize VICReg-maintained variance\" or \"is consistent\n     with\"\
  ; do NOT use \"breakthrough\", \"causal driver\", \"eliminated\", \"BEST\",\n  \
  \   \"proves\", \"demonstrates\", or \"resolves.\"\n   - Even a fully-confirmed\
  \ C1+C2+C3 result is reported per the constructional\n     framing in the hypothesis,\
  \ not as \"sim_loss_dyn causes collapse.\"\n\nFILES TO CREATE:\n- src/run_phase0_mask_dyn_sim_shared.py\
  \ (NEW): experiment runner\n\nFILES TO MODIFY:\n- src/pre_registration.md (UPDATE\
  \ with iter_028 plan)\n\nFILES NOT TO MODIFY:\n- src/models_dual_stream.py (mask_dyn_sim\
  \ handled in runner, not model)\n- src/models_separate_dyn.py (not needed for this\
  \ experiment)\n- src/environment.py\n\nTotal runs: 4 arms × 10 seeds = 40 runs ×\
  \ 8000 steps each.\nExpected wall time: ~30-40 minutes with parallel workers (CPU).\n"
