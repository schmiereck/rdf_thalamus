experimenter_view: 'The Architectural Ceiling experiment falsified the hypothesis.
  All three

  architectural variants (conv4 dynamics source, expanded d_max=16, and

  sub-features K=4) failed to improve semantic disentanglement while

  maintaining tracking quality. Arm C (K=4) was particularly problematic:

  it collapsed in 100% of seeds (vs 20% for Ctrl), and its identity probe

  delta_R2 (-0.0555) was worse than Ctrl (-0.0346). Sub-feature probes

  showed distributed, not selective, encoding — no sub-feature specialized

  on a specific identity dimension (R, G, B, radius). The SFA objective

  is not producing slower dynamics features: normalized_dyn_var is ~1000x

  larger than normalized_coord_var across all arms. The bottleneck is not

  architectural capacity; it likely lies in the training objective, loss

  balance, or the shared CNN encoder design.

  '
