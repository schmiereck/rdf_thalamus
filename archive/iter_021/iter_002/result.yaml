experimenter_view: 'The experiment runner `src/run_phase0_sfa_archceiling.py` was
  successfully created

  and verified via dry-run. A critical bug was fixed in `src/models_dual_stream.py`:

  `torch.split(pred, self.d_max, dim=-1)` failed when `d_dyn != d_max` (e.g., K=4

  sub-features or conv4 dynamics source). Changed to

  `torch.split(pred, [self.d_max, self.d_dyn], dim=-1)` which correctly handles

  mismatched coordinate/dynamics dimensions.


  The dry run confirmed all 4 arms (Ctrl, Conv4, d_max=16, K=4) execute without

  crashes through training, evaluation, and checkpoint saving. With only 5 training

  steps, metrics show expected untrained behavior (collapse, zero R²). The full

  experiment (5000 steps × 5 seeds × 4 arms) is ready to launch.

  '
