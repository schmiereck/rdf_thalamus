falsification_criterion: 'PRIMARY: If Arm C (K=4 sub-features) fails to achieve mean
  delta_R2_identity

  ≥ 0.10 across 5 seeds at step 5000, the single-scalar bottleneck is NOT the

  primary cause of the disentanglement failure, and the hypothesis is falsified.


  SECONDARY (supporting evidence): If Arms A and B show delta_R2_identity

  improvements < 0.05 over Control, this confirms that richer feature sources

  and more spatial channels cannot compensate for the per-channel scalar bottleneck.


  ANCILLARY FALSIFICATION: If Arm C achieves delta_R2_identity ≥ 0.10 but

  delta_R2_color improvement(Arm C - Control) < 0.05, the sub-features are

  not selectively improving identity encoding — they are just adding capacity

  that happens to fit the probe.


  THRESHOLD CLARIFICATION (resolving Issue 2): All criteria use IMPROVEMENT-based

  thresholds: metric(arm) - metric(control) ≥ threshold. The absolute criterion

  from iter_021 (delta_R2_color(Arm A) ≥ 0.10) was incoherent with the observed

  improvement (+0.124) and is replaced.

  '
hypothesis: "The persistent semantic disentanglement failure (delta_R2_identity =\
  \ -0.035 in iter_021)\nis caused by an architectural information bottleneck: z_dyn[c]\
  \ is a single scalar\nper channel, and with d_t=3 active channels, only 3 scalars\
  \ are available to encode\n3 objects × 4 identity features (R, G, B, radius) = 12\
  \ values. This makes it\ninformation-theoretically impossible for z_dyn to fully\
  \ encode identity.\n\nExpanding z_dyn[c] from 1 scalar to K=4 sub-features per channel\
  \ (total capacity:\n3×4=12, matching the identity DOF) via a conv4-backed centroid-gated\
  \ per-channel\nfeature head will raise mean delta_R2_identity from -0.035 to ≥ +0.10,\
  \ and\nmean delta_R2_color from +0.050 to ≥ +0.15, across 5 seeds at 5000 steps.\n\
  \nThe three interventions are isolatable and ordered by cost:\n(a) Conv4 feature\
  \ readout: richer source (128-dim conv4 vs 8-dim conv_identity),\n    but z_dyn[c]\
  \ remains 1 scalar. Expected: small improvement if d_max=8\n    projection loses\
  \ identity information.\n(b) Expanded d_max=16: more spatial channels, but z_dyn[c]\
  \ remains 1 scalar.\n    Expected: minimal improvement since the bottleneck is per-channel\
  \ capacity,\n    not channel count.\n(c) Sub-features K=4: expands per-channel capacity\
  \ from 1 to 4 scalars.\n    Expected: largest improvement, as this directly addresses\
  \ the bottleneck.\n"
pre_registration_file: src/pre_registration.md
proposed_method: "== EXPERIMENT DESIGN ==\n\n4 arms × 5 seeds × 5000 steps. Seeds:\
  \ [42, 123, 456, 789, 999].\n\nArm Ctrl (CGIR+SFA+CCR, d_max=8, K=1, dyn_source=\"\
  spatial\"):\n  Replication of iter_021 Arm A as within-run control. Same architecture:\n\
  \  conv_identity: 128→8, centroid-gated readout, z_dyn shape (B, 8).\n  Purpose:\
  \ Establish baseline for improvement-based criteria.\n\nArm A (Conv4 CGIR, d_max=8,\
  \ K=1, dyn_source=\"conv4\"):\n  Intervention (a): Richer feature source. Instead\
  \ of reading z_dyn from the\n  d_max=8 conv_identity projection, read from conv4\
  \ features (B, 128, 8)\n  at the centroid-gated spatial position. Implementation:\
  \ interpolate conv4\n  to (B, 128, 128), use p_c from spatial stream to soft-attend,\
  \ producing\n  (B, d_max, 128) attended features, then linear(128→1) per channel\
  \ →\n  z_dyn (B, d_max). z_dyn[c] is still 1 scalar. Tests whether the d_max=8\n\
  \  projection bottleneck is the cause.\n\nArm B (Expanded d_max=16, K=1, dyn_source=\"\
  spatial\", CGIR):\n  Intervention (b): More latent spatial channels. d_max=16 instead\
  \ of 8.\n  conv_spatial and conv_identity project 128→16. More channels means each\n\
  \  channel can specialize more, but z_dyn[c] is still 1 scalar.\n  Tests whether\
  \ channel count vs per-channel capacity matters.\n\nArm C (Sub-Features K=4, d_max=8,\
  \ dyn_source=\"spatial\", CGIR):\n  Intervention (c): Expanded per-channel capacity.\
  \ conv_identity projects\n  128→d_max*K=32. Reshape to (B, d_max, K, 128) after\
  \ interpolation.\n  Use shared centroid attention p_c for all K sub-features of\
  \ each channel:\n  z_dyn[c,k] = sum_s p_c[c,s] * a_identity[c*K+k, s] → (B, d_max,\
  \ K).\n  Flatten to (B, d_max*K=32) for SFA/VICReg/predictor. SFA slowness on\n\
  \  all d_t*K=12 active features. VICReg on (B, 12) batch-wise. Predictor\n  input:\
  \ H*(d_max + d_max*K)=3*(8+32)=120, output: d_max+d_max*K=40.\n  Tests whether 1\
  \ scalar per channel is the fundamental bottleneck.\n\n== ALL ARMS PRESERVE ==\n\
  - SFA on z_dyn (all K sub-features per channel), sfa_weight=0.1\n- CCR covariance\
  \ mode on z_coord, ccr_smooth=10, ccr_spatial=10\n- d_t=3 frozen, GDASR log-only\n\
  - pos_encoding=\"none\" (pos-encoding-hurts is a cross-objective regularity)\n-\
  \ Adam lr=1e-3, batch=32, replay_buffer=2000\n- JEPA predictor as readout with stop-gradient\
  \ (M2)\n\n== METRICS IMPROVEMENTS (resolving Issues 1 and 2) ==\n\n1. SLARNESS RESOLUTION\
  \ (Issue 1):\n   - Report temporal_var(z_dyn) and temporal_var(z_coord) as SEPARATE\n\
  \     absolute numbers (mean squared frame-to-frame change per dimension).\n   -\
  \ Report NORMALIZED temporal variance: temporal_var / (spatial_std²),\n     giving\
  \ a scale-free measure of \"how fast\" each stream is relative\n     to its own\
  \ magnitude. SFA works iff normalized_dyn_var < normalized_coord_var.\n   - Report\
  \ centroid tracking quality: corr(Δz_coord[c], Δtrue_pos[c])\n     per channel.\
  \ If z_coord is nearly static (normalized_coord_var ≈ 0)\n     while objects move,\
  \ this is a tracking failure, not slowness.\n   - Label the slowness ratio convention\
  \ explicitly: ratio = dyn_delta/coord_delta,\n     where ratio < 1 means SFA succeeded\
  \ (z_dyn slower than z_coord).\n\n2. THRESHOLD CLARIFICATION (Issue 2):\n   - C3\
  \ (color): improvement(arm - ctrl) in delta_R2_color ≥ 0.10\n   - C4 (identity):\
  \ improvement(arm - ctrl) in delta_R2_identity ≥ 0.10\n   - Also report absolute\
  \ delta_R2 for reference, but improvement is primary.\n\n3. PER-DIMENSION PROBES\
  \ for Arm C (K=4):\n   - For each channel c and sub-feature k, fit R² against [R,\
  \ G, B, radius]\n     individually to characterize which sub-features encode which\
  \ identity\n     dimensions. This tests whether disentanglement is emergent (sub-feature\
  \ k\n     spontaneously encodes R, etc.) or distributed.\n\n4. COLLAPSE CHECK: per-dim\
  \ std < 0.5 in < 2/5 seeds (same as iter_021).\n5. CENTROID MSE: arm MSE ≤ 1.10\
  \ × ctrl MSE (no tracking degradation).\n6. GDASR growth-point logging (log-only,\
  \ per M3).\n\n== CODE CHANGES ==\n\n1. src/models_dual_stream.py:\n   - Add `sub_features`\
  \ (K, default=1) and `dyn_source` (\"spatial\"|\"conv4\",\n     default=\"spatial\"\
  ) to NonParametricEncoder.\n   - For dyn_source=\"conv4\", K=1: add dyn_proj Linear(128,1),\
  \ compute attended\n     conv4 features via centroid attention, then project 128→1\
  \ per channel.\n   - For sub_features=K: modify conv_identity to output d_max*K\
  \ channels,\n     reshape after interpolation, apply shared centroid attention,\
  \ produce\n     z_dyn of shape (B, d_max*K) when flattened.\n   - Modify NonParametricJEPASpatial\
  \ to pass K and dyn_source through.\n   - In SFA mode: handle z_dyn shape (B, d_max*K)\
  \ for SFA, VICReg, predictor.\n   - Modify DualStreamPredictor to accept d_dyn=d_max*K\
  \ instead of d_max,\n     with input H*(d_max + d_dyn) and output d_max + d_dyn.\n\
  \n2. src/run_phase0_sfa_archceiling.py (NEW):\n   - 4 arms × 5 seeds × 5000 steps\n\
  \   - Same training loop as run_phase0_sfa_cgir.py\n   - Updated evaluation: normalized\
  \ temporal variance, centroid tracking\n     quality, per-sub-feature identity probes\
  \ for Arm C\n   - Checkpoint at step 2500 and final at 5000\n   - Falsification\
  \ audit using improvement-based criteria\n\n3. src/pre_registration.md: Update with\
  \ this plan.\n"
