experimenter_view: 'Iter_027 completed all 40 runs (4 arms x 10 seeds). Both shared-backbone
  arms (Aprime, A) failed the gate with 30-40% collapse, replicating baseline behavior.
  Crucially, Arm B (separate backbone, full JEPA+VICReg) also collapsed at 30%, yielding
  a SECOND NULL and triggering the mandatory project pivot. The breakthrough finding
  is Arm C (separate backbone, mask_dyn_sim=True / VICReg-only on z_dyn), which achieved
  0% collapse across all 10 seeds. This isolates the similarity-matching pressure
  (sim_loss) on z_dyn as the true structural driver of collapse, not the shared CNN
  backbone itself. Decoupling z_dyn from similarity pressure solves the problem, pending
  the planned pivot.

  '
