task: "\n# Phase 0 — Objective Migration: SFA on z_dyn + VICReg\n\n## Pre-Registration\
  \ File\nYou MUST read `src/pre_registration.md` first and adhere to its hypotheses\
  \ and falsification criteria. Also read the Manager's notes below carefully — there\
  \ are CRITICAL modifications to the pre-registration that you must implement.\n\n\
  ## Manager's Critical Modifications (MUST IMPLEMENT)\n\n1. **Reframe claim (3) as\
  \ a sanity check**: The slowness ratio (||Δz_dyn||² / ||Δz_coord||²) merely verifies\
  \ that the SFA objective is active and VICReg prevents collapse. It does NOT constitute\
  \ evidence of semantic disentanglement. State this explicitly in the pre-registration\
  \ update.\n\n2. **Add semantic disentanglement probes**: Linear probes predicting\
  \ object identity (color as a 3D regression target) from z_dyn vs z_coord, and object\
  \ centroid position from z_coord vs z_dyn. If SFA creates semantic separation, z_dyn\
  \ should predict color well and position poorly, and vice versa for z_coord.\n\n\
  3. **Augment C3 with semantic probe criterion**: \"C3 is falsified if the linear-probe\
  \ R² for object color from z_dyn does not exceed that from z_coord by at least 0.10\
  \ (10 percentage points in R²).\" The original slowness-ratio C3 becomes a sanity\
  \ check, not the main falsification criterion.\n\n## CRITICAL: Architecture Context\n\
  \nRead `src/models_dual_stream.py` carefully. The `NonParametricEncoder` computes\
  \ BOTH z_coord and z_dyn from a single shared `a_spatial = self.forward_spatial(x)`:\n\
  - `z_coord = soft_argmax(a_spatial)` — centroids (position)\n- `z_dyn = a_spatial.mean(dim=-1)`\
  \ — mean activation (identity)\n\nSince both streams share the same spatial feature\
  \ map, SFA gradients on z_dyn flow through a_spatial → conv_spatial → conv1-4, indirectly\
  \ shaping z_coord too. This is the structural basis for testing whether SFA on z_dyn\
  \ produces good z_coord readouts.\n\n## Step 1: Modify src/models_dual_stream.py\n\
  \nAdd SFA mode to `NonParametricJEPASpatial`:\n\n1. Add `primary_objective` parameter\
  \ to `__init__()` (default \"jepa\" for backward compat). Valid values: \"jepa\"\
  , \"sfa\".\n\n2. Add `sfa_weight` parameter to `__init__()` (default 1.0).\n\n3.\
  \ Add `gdasr_log_only` parameter to `__init__()` (default False). When True, `update_recruitment_logic()`\
  \ computes and logs growth-point signals but NEVER modifies `d_t`.\n\n4. In `forward()`,\
  \ when `primary_objective == \"sfa\"`:\n   a. **SFA loss**: `L_sfa = F.mse_loss(z_target_dyn[:,\
  \ :self.d_t], z_hist_dyn[:, -1, :self.d_t].detach())`\n      - `z_hist_dyn[:, -1,\
  \ :]` is the most recent history frame (z at time t)\n      - `z_target_dyn` is\
  \ z at time t+1\n      - `.detach()` on z_hist_dyn[:, -1, :] ensures SFA pushes\
  \ z(t+1) toward z(t) without also pulling z(t) — cleaner gradient\n   b. **VICReg\
  \ on z_dyn ONLY** (not z_coord): compute var_loss and cov_loss on `z_target_dyn[:,\
  \ :self.d_t]` only\n   c. **Predictor for surprise readout**: Use detached encoder\
  \ outputs:\n      - `z_hist_coord.detach()`, `z_hist_dyn.detach()` as predictor\
  \ inputs\n      - sim_loss computed as: `F.mse_loss(z_pred_coord[:, :dt_pred], z_target_coord[:,\
  \ :dt_pred].detach()) + F.mse_loss(z_pred_dyn[:, :dt_pred], z_target_dyn[:, :dt_pred].detach())`\n\
  \      - This trains the predictor ONLY, not the encoder\n   d. **Total loss**:\
  \ `sfa_weight * L_sfa + var_weight * var_loss_dyn + cov_weight * cov_loss_dyn +\
  \ sim_weight * sim_loss`\n      - SFA + VICReg terms have gradients to encoder only\n\
  \      - sim_loss has gradients to predictor only (encoder outputs are detached)\n\
  \   e. Return the same dict structure but add `sfa_loss` key. Set `sim_loss_coord`,\
  \ `sim_loss_dyn` from the detached computation.\n   f. Do NOT apply var_loss or\
  \ cov_loss to z_coord under SFA mode.\n\n5. When `primary_objective == \"jepa\"\
  `: keep existing behavior exactly as-is (backward compatible).\n\n6. Modify `update_recruitment_logic()`\
  \ to respect `gdasr_log_only`: when True, compute and print growth-point detection\
  \ signals but never change `d_t`. Log the would-have-recruited events.\n\n## Step\
  \ 2: Create src/run_phase0_sfa.py\n\nFull experiment runner with 3 arms × 5 seeds:\n\
  \n### Arms:\n- **Arm A (SFA+VICReg)**: `NonParametricJEPASpatial(primary_objective=\"\
  sfa\", pos_encoding=\"none\", sfa_weight=1.0, gdasr_log_only=True)`. sim_weight=25.0,\
  \ var_weight=25.0, cov_weight=25.0. d_t=3 frozen.\n- **Arm B (JEPA+VICReg Baseline,\
  \ B1)**: `NonParametricJEPASpatial(primary_objective=\"jepa\", pos_encoding=\"none\"\
  , gdasr_log_only=True)`. sim_weight=25.0, var_weight=25.0, cov_weight=25.0. d_t=3\
  \ frozen.\n- **Arm C (SFA+VICReg+pos_encoding)**: Same as Arm A but `pos_encoding=\"\
  sinusoidal\"`. Tests whether explicit position channels help under SFA.\n\n### Training\
  \ Protocol (shared):\n- Seeds: [42, 123, 456, 789, 999]\n- Environment: PhysicsSandbox(N=3,\
  \ seed=seed) for 3000 steps\n- Passive observation only (no motor, action={\"acc\"\
  : 0.0, \"push\": False})\n- History: deque(maxlen=4) for H=3 history + 1 target\n\
  - Replay buffer: capacity 2000, prefill 100 transitions\n- Optimizer: Adam, lr=1e-3\n\
  - d_t = 3 frozen from start\n- GDASR in log-only mode\n- Batch size: 32\n- CCR mode:\
  \ 'none' for this phase (clean SFA vs JEPA comparison without confounds)\n\n###\
  \ Evaluation Protocol (at step 3000, checkpoint at 1500):\n\n1. **Non-collapse check**\
  \ (C1):\n   - `has_collapsed` criterion: `e_a_dim >= 0.1 * e_a_all` AND `std_x_mean\
  \ > 5.0`\n   - Per-dimension std: `torch.std(z_dyn, dim=0)` — all active dims must\
  \ have std >= 0.5\n   - Report: collapsed (bool), per-dim stds\n\n2. **Centroid\
  \ decoding MSE** (C2):\n   - Use 200 test frames from a separate test environment\
  \ (seed+10000)\n   - For each of 3 objects: linear probe on soft-argmax centroids\
  \ vs true object positions\n   - Report mean MSE across objects, and per-object\
  \ MSE\n   - Also compute for the last dimension (target_dim_idx = 2) specifically\n\
  \n3. **Slowness metrics** (sanity check, NOT primary falsification):\n   - Over\
  \ 200 test frames, compute:\n     - `slow_dyn = mean(||z_dyn(t) - z_dyn(t-1)||^2)`\n\
  \     - `slow_coord = mean(||z_coord(t) - z_coord(t-1)||^2)`\n     - `slowness_ratio\
  \ = slow_dyn / slow_coord`\n   - Report for each arm\n\n4. **Semantic disentanglement\
  \ probes** (primary C3):\n   - Over 200 test frames, for each frame:\n     a. Get\
  \ z_coord (1, d_t) and z_dyn (1, d_t) from the encoder\n     b. Get ground-truth\
  \ positions (3,) and colors (3, 3) for each object\n   - For each dimension d in\
  \ [0, d_t):\n     a. Match dimension d to the nearest object by centroid position\
  \ (z_coord[d] vs true positions)\n     b. This establishes a dimension-object pairing\n\
  \   - Linear regression probes (train on first 100 frames, test on last 100):\n\
  \     a. **z_dyn → color**: R² for predicting matched object's color (3 channels,\
  \ separate R² per channel, report mean)\n     b. **z_coord → color**: Same prediction\
  \ from z_coord\n     c. **z_coord → position**: R² for predicting matched object's\
  \ position from z_coord[d]\n     d. **z_dyn → position**: Same prediction from z_dyn\n\
  \   - **Key metric**: `delta_R2_color = R2(z_dyn → color) - R2(z_coord → color)`.\
  \ C3 fails if delta_R2_color < 0.10\n\n5. **VICReg health**:\n   - Per-dimension\
  \ std of z_dyn across the batch\n   - Mean absolute off-diagonal correlation between\
  \ active z_dyn dimensions\n\n6. **GDASR growth-point log**:\n   - Count and timing\
  \ of would-have-recruited events during training\n   - Final EMA error value\n\n\
  7. **Prediction error (surprise)**:\n   - sim_loss on test frames (predictor quality)\n\
  \   - Per-dimension prediction error breakdown\n\n### Output:\nSave results to `archive/iter_020/results/`:\n\
  - `phase0_raw_results.json`: Full results for each arm × seed combination\n- `phase0_summary.csv`:\
  \ Summary table with key metrics\n- `phase0_training_curves.csv`: Training loss\
  \ curves (sampled every 100 steps)\n\n## Step 3: Update src/pre_registration.md\n\
  \nUpdate the pre-registration with:\n- Modified hypothesis (claim 3 reframed as\
  \ sanity check)\n- New C3 with semantic probe criterion (delta_R2_color >= 0.10)\n\
  - Keep C1 and C2 as originally specified\n- All other details from the approved\
  \ plan\n\n## Step 4: Execute and Save Results\n\nRun the full sweep. Save all results\
  \ to the archive directory.\n\n## Important Notes:\n- The sfa_weight=1.0 is a starting\
  \ point. If the first run shows SFA is too weak or too strong, adjusting it is legitimate\
  \ but MUST be documented with rationale in the output.\n- Do NOT silently tune after\
  \ viewing results.\n- Report both directions honestly: if MSE_SFA < MSE_JEPA, note\
  \ it; if MSE_SFA > MSE_JEPA but within 10%, that's a successful bridge.\n- Use CPU\
  \ (torch device \"cpu\") unless CUDA is available.\n- Set torch.set_num_threads(2)\
  \ to prevent CPU thrashing.\n- Each training run (3000 steps) should take ~2-5 minutes\
  \ on CPU.\n"
