experimenter_view: 'Successfully added semantic disentanglement probes to the Phase
  0 runner.

  The compute_semantic_probes() function matches each latent dimension to the nearest

  object by centroid position, then fits linear probes on train/test splits to measure

  R² for predicting object color (identity) and position from both z_dyn and z_coord.

  The key metric delta_R2_color = R2(z_dyn→color) - R2(z_coord→color) tests whether

  SFA genuinely separates identity from position, not just that the slowness loss
  term

  was minimized. The CSV/JSON output infrastructure is updated to persist these metrics.

  '
