experimenter_view: 'The CGIR architectural change was evaluated across 4 arms × 5
  seeds × 5000 steps.

  C1 (collapse) and C2 (centroid MSE) both passed, showing CGIR does not degrade

  training stability or position tracking. However, C3 (semantic disentanglement)

  failed: Arm A delta_R2_color = 0.0498, below the 0.10 threshold. Notably, this

  is an improvement over Arm B (mean-pooling baseline) which had delta_R2_color =

  -0.0736, but the effect size is insufficient to validate the hypothesis. C4

  (identity probe) also failed with delta_R2_identity = -0.0346. The hypothesis

  that spatial-mean pooling was the primary cause of semantic disentanglement

  failure is therefore falsified. CGIR may provide partial benefit, but the root

  cause lies elsewhere or requires stronger architectural intervention.

  '
