experimenter_view: 'The full Architecture Ceiling Probe experiment (iter_025) completed
  successfully with all 23 runs finishing without error. Both pre-registered hypotheses
  are falsified:


  H1 (Architecture Capacity): Arm B (supervised color probe, d_max=8) achieved a mean
  delta_R2_color of only +0.057 on non-collapsed seeds against a threshold of 1.060,
  with 60% collapse rate. The shared-CNN encoder does not route identity to z_dyn
  even under direct supervision.


  H2 (ID-Contrastive Viability): Arm C (color-similarity contrastive, d_max=8) achieved
  +0.033 (greedy) / +0.115 (Hungarian) on non-collapsed seeds, also far below threshold
  with 60% collapse. The contrastive formulation is insufficient.


  Arm A drift check passed (mean delta_R2 = -0.025 vs iter_022-024 reference ~0.00-0.02),
  confirming the fresh seed batch is comparable.


  Arm D (d_max=16 supervised) performed worse than Arm B on non-collapsed seeds, refuting
  the channel-capacity hypothesis.


  High mismatch rates (47-67%) between sorted and Hungarian matching confirm all claims
  must be conditional on the matching scheme.


  The outcome quadrant is B-fail / C-fail, consistent with an architecture-level bottleneck.
  Next step per pre-registration: separate z_dyn encoder.

  '
