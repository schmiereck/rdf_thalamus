experimenter_view: 'The corrected v2 experiment (lower LR 3e-4, gradient clipping,
  8000 steps, 10 seeds,

  Hungarian-primary matching, no noise floor) successfully ran all 50 runs but did
  NOT

  achieve its scientific goals. The control arm (A) collapse rate is 30% (>20% power

  threshold), rendering the experiment underpowered and invalidating any architecture-

  level bottleneck claim. Arm B (supervised) also has 30% collapse and a negative
  mean

  delta_R2_color (-0.024), far below the 0.10 threshold. Critically, sorted vs Hungarian

  matching disagree on pass/fail for 43% of Arm B''s non-collapsed seeds, making the

  outcome matching-dependent and the falsification claim unearned. Arm C (contrastive)

  fares worse with 50% collapse. The one positive finding: Arm E (d_max=16 control)

  achieves delta_R2_color = 0.14 without any identity objective, confirming the iter_023

  d_max=16 improvement as a pure capacity effect. The core issue remains representation

  collapse in z_dyn despite VICReg regularization — the architecture can encode position

  but not identity reliably. Next step must focus on fixing collapse (e.g., even lower
  LR,

  larger batch size, stronger variance regularization, or architectural changes) before

  any architecture-ceiling probe can be valid.

  '
