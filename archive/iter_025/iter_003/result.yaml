  ramp (0.1 → 25.0 over 500 steps) for Arms B/D in run_phase0_id_probe.py.

  Also fixed two secondary issues in the analysis generator: N/A formatting

  crash and Unicode encoding failure on Windows.

  The dry run (5 steps) completed successfully for all 4 arms plus 3 noise-floor

  runs without gradient errors, confirming the in-place bug is resolved and the

  weight ramp is applied correctly. The full 23-run experiment (3 noise floor +

  4 arms × 5 seeds × 5000 steps) was not executed due to execution limits.

  '
