experimenter_view: 'The pre-registration for iter_025 has been fully rewritten to
  incorporate the Research Manager''s three required revisions:

  1. Matching Confound Protocol: Added dual matching schemes (sorted-position vs.
  oracle/Hungarian) for all supervised arms (B, C, D) with a mandatory mismatch rate
  report. Ceiling claims are explicitly conditional on the matching scheme if disagreement
  exceeds 5%.

  2. Noise Floor & Separation Criteria: Added 3 frozen-random-encoder baseline runs
  (seeds 7, 17, 31) to establish the empirical noise floor. Success thresholds upgraded
  to max(0.10, floor_mean + 0.08). Arm D outcomes explicitly disentangled from H1.

  3. Language & Reporting Hygiene: Enforced strict phrasing for failure/success quadrants
  to prevent overclaiming architecture capability from matching artifacts or supervised
  signals. Added Arm A drift check (>0.03 absolute from reference suspends comparison).

  The document is now ready for the experimental execution phase.

  '
