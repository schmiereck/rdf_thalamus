experimenter_view: 'Both D1 (batch-level temporal contrastive NT-Xent) and D2 (variance-ramped
  SFA)

  are FALSIFIED on the pre-registered M2 decisive test. Neither achieves the

  required mean ΔR²_color ≥ 0.30 with lower 95% CI ≥ 0.18 on the 30-seed union bank.


  D1 produced mean ΔR²_color = 0.115 (CI lower = 0.007), far below threshold.

  The batch-level NT-Xent signal is too weak to enforce object identity encoding.

  Object-level temporal matching (same-object-across-time positives) was NOT

  implemented; the existing batch-level implementation treats each batch element

  as its own positive pair, which does not bind channel identity to physical objects.


  D2 produced mean ΔR²_color = 0.189 (CI lower = 0.074), closer but still failing.

  The variance ramp (0→5.0 over 4000 steps) did not improve over the static

  sfa_weight=5.0 configuration from iter_029 Arm B (which achieved ~0.27 on 20 seeds).

  The ramp may have delayed the SFA pressure too long, allowing the representation

  to settle into a non-identity-encoding configuration before the full weight kicked
  in.


  Both arms had 0% collapse rate (all 30 seeds non-collapsed), confirming that

  the separate-backbone + mask_dyn_sim + coord_vicreg configuration is structurally

  stable. However, stability does not translate to identity decodability.


  Hard seeds 53 and 71 performed poorly on both arms (D1: 0.064/-0.168; D2: 0.031/-0.068),

  consistent with their historical difficulty.


  Per the pre-registration, since both D1 and D2 are falsified, ΔR²_color ≥ 0.30

  is deemed unachievable by any decoder-free objective tested to date. The project

  should accept the current representation quality per ARM 1 verdict.

  '
