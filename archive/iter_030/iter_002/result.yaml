experimenter_view: 'The ARM 1 integration smoke-test completed successfully across
  all 48 seed+condition

  combinations (10 fresh seeds × 4 conditions + 2 hard seeds × 4 conditions).

  All three pre-registered gates failed:


  G1 (Tracking): CLTS-SFA mean tracking error = 45.09 pixels, CLTS-VICReg = 36.22

  pixels — both far above the 20-pixel threshold. The pointer centroid tracking

  is functional but not tight enough for precise motor control.


  G2 (Collision attention switching): All conditions achieved ~99-100% collision

  switch rate because collisions are extremely frequent in the closed-loop

  regime (the push-heavy controller creates constant object-object contacts).

  With controls also at ceiling, the 15pp advantage criterion cannot be met.


  G3 (Perturbation sensitivity): All conditions achieved 100% perturbation

  switch rate because the mass perturbation forces the pointer near object 0

  and the push action makes object 0 the most surprising channel. Controls

  also hit ceiling, so the 15pp advantage criterion fails.


  Verdict: 0/3 gates pass for CLTS-SFA → REPRESENTATION INSUFFICIENT.

  Both CLTS-SFA and CLTS-VICReg fail ≥2 gates → "representation truly

  insufficient" per pre-registered decision rules. ARM 2 (M2 decisive test)

  becomes critical.

  '
