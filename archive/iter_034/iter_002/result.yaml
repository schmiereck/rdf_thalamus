experimenter_view: 'The benchmark was falsified because the mass-estimation ordering
  is inverted:

  PASSIVE < RANDOM < ORACLE, opposite of the pre-registered hypothesis. The

  root cause is that pointer-object collisions yield highly sensitive mass

  estimates (m_i = 10 * -Δv_pointer / Δv_object). When the pointer hits a

  moving object, Δv_object is often very small, producing noisy, outlier-prone

  estimates. Meanwhile, PASSIVE mode relies more on object-object collisions,

  which provide ratio constraints (m_i/m_j = -Δv_j/Δv_i) that average out more

  stably via least-squares. All sanity checks passed, so the implementation is

  likely correct; the metric itself is degenerate for this physics regime.

  '
