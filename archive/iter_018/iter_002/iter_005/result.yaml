experimenter_view: 'The critical bug in train_passive_cached() was fixed by adding
  model.d_t = 3

  immediately after load_state_dict() during cache loading. Previously the freshly

  initialized model had d_t=2, and after loading the state dict the d_t field

  remained 2, silently breaking the WUP gating checks in the active phase that

  require branch_model.d_t == 3. The NonParametricJEPASpatial.clone() method

  already correctly propagates d_t via cloned.d_t = self.d_t, so run_active_branch

  will properly see d_t=3 when branching from a loaded model. CUDA is not available

  on this machine (PyTorch 2.12.0 CPU build). The passive cache files exist from

  prior runs so a re-execution would load them with the corrected d_t=3 setting.

  '
