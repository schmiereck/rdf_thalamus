experimenter_view: 'The EG-MDL (Entropy-Gated MDL) experiment completed successfully
  across all seeds.

  All three arms—including the WUP-MDL baseline and both EG-MDL variants—achieved

  perfect recruitment (5/5) on the transition sweep and zero false recruitment (0/5)

  on the Noisy-TV control sweep. The mean centroid MSE for recruited runs was 55.58,

  well below the 65.0 falsification threshold. The θ-sensitivity check showed the

  mechanism is robust to the exact threshold value (both θ=0.90 and θ=0.85 passed).

  Notably, the arms produced identical results within each seed because they share

  the same underlying model state; the EG-MDL gate accepted every genuine transition

  since ρ was consistently ≪ θ. No arm was falsified.

  '
