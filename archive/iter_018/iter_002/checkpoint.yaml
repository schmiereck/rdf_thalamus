  \ else \"cpu\")`\n- The passive training function `train_passive_cached()` from\
  \ Phase 17 can be reused as-is\n- The evaluation function `evaluate_branch()` can\
  \ be reused\n- The `categorizer_consistency_ratio()` function can be reused for\
  \ MDL gate computation\n\n### Output Requirements\n\n1. Create `src/run_phase18_experiments.py`\
  \ with the full experiment code\n2. Run the experiment and save all results to `archive/iter_018/results/`\n\
  3. Produce a comprehensive markdown report at `archive/iter_018/results/phase18_report.md`\n\
  4. The report must include: hypothesis, method, per-seed results table, mean±std\
  \ summary, falsification audit, and interpretation\n\n### CRITICAL: Pre-Registration\
