task: "## Phase 18: EG-MDL (Entropy-Gated MDL) Implementation and Experimentation\n\
  \nYou must implement and run the full EG-MDL experiment, then analyze the results\
  \ against the pre-registered falsification criteria. Read `src/pre_registration.md`\
  \ FIRST to understand the exact hypothesis, arms, and falsification criteria.\n\n\
  ### Context\n\nThe Thalamus project has been iteratively solving the problem of\
  \ dimension recruitment gating. Phase 16 established WUP-MDL (Probationary Warm-Up\
  \ Period + MDL consistency gate) which achieves 100% recruitment rate on N=3→4 transition\
  \ but 100% false recruitment on Noisy-TV distractors. Phase 17 falsified ESUG (encoder-only\
  \ gating without warm-up) because cold-started encoder projections produce rough\
  \ temporal dynamics.\n\nThe Phase 18 hypothesis: Adding a prediction-trend gate\
  \ to WUP-MDL will maintain ≥80% recruitment while reducing Noisy-TV false recruitment\
  \ from 100% to ≤20%.\n\n### Arms to Implement\n\n1. **Arm P (WUP-MDL, W=100)** —\
  \ Baseline from Phase 17. Re-implement identically for matched comparison.\n2. **Arm\
  \ S (EG-MDL, W=100, θ=0.90)** — During the WUP period, record per-step prediction\
  \ error e[t] for the proposed 4th dimension. At end of WUP, compute ρ = E_late /\
  \ E_early where E_early = mean(e[0:W/2]) and E_late = mean(e[W/2:W]). Gate accepts\
  \ if MDL ratio < 1.0 AND ρ < 0.90.\n3. **Arm S_alt (EG-MDL, W=100, θ=0.85)** — Same\
  \ as Arm S but θ=0.85. Robustness arm to test θ-sensitivity.\n\n### Implementation\
  \ Details\n\n**Reference code:** `src/run_phase17_experiments.py` provides the complete\
  \ experimental pipeline. Create `src/run_phase18_experiments.py` based on this,\
  \ with the following modifications:\n\n#### Prediction-Trend Gate Computation\n\n\
  During the WUP probationary period, at each training step, compute the **per-dimension\
  \ prediction error for the 4th dimension** (index 3):\n\nFrom the forward pass outputs\
  \ `(z_pred_coord, z_pred_dyn), (z_target_coord, z_target_dyn)`:\n```python\n# Per-dimension\
  \ prediction error for dimension 3\ne_coord_dim3 = F.mse_loss(z_pred_coord[:, 3],\
  \ z_target_coord[:, 3])\ne_dyn_dim3 = F.mse_loss(z_pred_dyn[:, 3], z_target_dyn[:,\
  \ 3])\ne_total_dim3 = (e_coord_dim3 + e_dyn_dim3).item()\n```\n\nStore these in\
  \ a list `wup_errors` throughout the WUP period.\n\nAt the end of WUP (step = probation_end_step):\n\
  ```python\nW = len(wup_errors)\nE_early = np.mean(wup_errors[:W//2])\nE_late = np.mean(wup_errors[W//2:])\n\
  rho = E_late / max(E_early, 1e-8)\n```\n\n**Composite gate for Arm S:**\n- MDL criterion:\
  \ ratio < 1.0 (same as Arm P)\n- Prediction-trend: ρ < 0.90\n- BOTH must pass for\
  \ acceptance\n\n**Composite gate for Arm S_alt:**\n- Same but ρ < 0.85\n\n#### Arm-specific\
  \ Branch Logic\n\nModify `run_active_branch()` to support a new `gating=\"eg_mdl\"\
  ` option alongside the existing \"mdl\" and \"esug\":\n\nFor Arms S and S_alt:\n\
  1. Same WUP period as Arm P (d_t=4, train both encoder and predictor for W steps)\n\
  2. During WUP, record `wup_errors` (per-step dim-3 prediction error)\n3. At end\
  \ of WUP, compute MDL ratio AND prediction-trend ratio ρ\n4. Apply composite gate\n\
  \nThe arm definitions should be:\n```python\narms = [\n    (\"Arm P (WUP-MDL, W=100)\"\
  ,    100,  None, \"mdl\",    None),\n    (\"Arm S (EG-MDL, θ=0.90)\",    100,  None,\
  \ \"eg_mdl\", 0.90),\n    (\"Arm S_alt (EG-MDL, θ=0.85)\",100,  None, \"eg_mdl\"\
  , 0.85),\n]\n```\n\n### Experimental Protocol\n\n**Seeds:** [42, 123, 456, 789,\
  \ 999] (same as Phase 17 for matched comparison)\n\n**Sweep 1 — Transition Sweep:**\
  \ N=3→4 clean objects. \n- Passive training on N=3 for 1500 steps (shared across\
  \ arms per seed)\n- Active CLTS training for steps 1501-3000 with 4th object introduced\
  \ at step 1500\n- WUP proposal triggered at step 1800 (same as Phase 17)\n- Evaluate\
  \ at steps [1500, 1600, 1700, 1800, 1900, 2000, 2500, 3000]\n\n**Sweep 2 — Control\
  \ Sweep:** N=3 clean + 1 Noisy-TV distractor.\n- Same passive pre-training on N=3\n\
  - Active CLTS with Noisy-TV replacing the 4th object\n- Same WUP proposal at step\
  \ 1800\n- Measure false recruitment rate\n\n### Metrics to Collect\n\nPer arm per\
  \ seed:\n- `recruitment_accepted` (bool): whether the dimension was permanently\
  \ recruited\n- `mse_cent` (float): centroid decoding MSE for the 4th object/distractor\n\
  - `test_sim_loss` (float): test simulation loss on N=4 (or N=3 for control)\n- `mdl_ratio`\
  \ (float): MDL consistency ratio at gate evaluation\n- `rho` (float): prediction-trend\
  \ ratio at gate evaluation\n- `wup_errors` (list): per-step prediction errors during\
  \ WUP\n- `attention_switch_rate` (float): post-recruitment attention stability\n\
  - `centroid_tracking_error` (float): post-recruitment centroid tracking accuracy\n\
  \n### Analysis Required\n\nAfter all sweeps complete:\n\n1. **Recruitment rates**\
  \ per arm (transition sweep): count of seeds where accepted\n2. **False recruitment\
  \ rates** per arm (control sweep): count of seeds where accepted\n3. **Mean ± std**\
  \ of mse_cent per arm (transition sweep, only recruited seeds)\n4. **Welch's t-tests**:\
  \ Arm P vs Arm S on mse_cent, attention_switch_rate\n5. **Falsification audit**\
  \ against the pre-registered criteria:\n   - C1: Recruitment rate < 80% on transition\
  \ sweep\n   - C2: False recruitment rate > 20% on control sweep\n   - C3: Mean centroid\
  \ decoding MSE > 65.0 on transition sweep\n   - C4 (NEW): θ-sensitivity: if Arm\
  \ S passes but Arm S_alt fails (or vice versa), report as θ-sensitive finding\n\
  6. **Save results** to `archive/iter_018/results/` as CSV, JSON, and markdown report\n\
  \n### Important Implementation Notes\n\n- The model class is `NonParametricJEPASpatial`\
  \ from `src/models_dual_stream.py`\n- The environment class is `PhysicsSandbox`\
  \ from `src/environment.py` \n- The motor controller is `CLTSMotorController` from\
