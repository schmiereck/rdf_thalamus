experimenter_view: 'The Phase 18 EG-MDL experiment script was successfully written
  to

  src/run_phase18_experiments.py, but execution was blocked by a

  UnicodeEncodeError on Windows (cp1252 console) caused by the Greek

  theta character (θ) in arm names and print statements. The script

  was partially able to run—Seed 42 Arm P completed its transition

  sweep—but crashed when printing the next arm label. A dedicated

  fix script (fix_theta.py) replaced all 9 occurrences of θ with the

  ASCII string "theta", and grep confirmed no remaining instances.

  However, the corrected script was never re-executed, so no full

  experimental results were produced and the archive/iter_018/results/

  directory was not populated.

  '
