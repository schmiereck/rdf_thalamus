falsification_criterion: "The EG-MDL hypothesis is falsified if ANY of the following\
  \ hold across the\n5-seed matched sweep:\n\n1. Recruitment rate < 80% on the N=3→4\
  \ transition sweep (WUP-MDL baseline\n   achieves 100%; allowing modest degradation\
  \ from the stricter gate).\n2. False recruitment rate > 20% on the Noisy-TV control\
  \ sweep (WUP-MDL\n   baseline achieves 100% false recruitment; this is the critical\
  \ improvement\n   target).\n3. Mean centroid decoding MSE > 65.0 on the transition\
  \ sweep (WUP-MDL\n   baseline achieves 57.34; allowing modest degradation from the\
  \ additional\n   gate constraint).\n\nThese three criteria jointly require EG-MDL\
  \ to solve BOTH the recruitment\nproblem (which ESUG failed at) and the distractor-rejection\
  \ problem (which\nWUP-MDL failed at). Improving one at the expense of the other\
  \ is insufficient.\n"
hypothesis: 'Adding a WUP-period prediction-trend gate to WUP-MDL (creating "EG-MDL")
  will

  maintain ≥80% recruitment rate on the N=3→4 transition sweep while reducing

  the Noisy-TV false recruitment rate from 100% (WUP-MDL baseline) to ≤20%,

  with centroid decoding MSE ≤ 65.0.


  The prediction-trend gate computes the improvement ratio ρ = E_late / E_early

  during the WUP period, where E_early and E_late are the mean prediction errors

  over the first and second halves of the warm-up window. A genuine new object

  produces ρ << 1.0 (predictor learning smooth dynamics), while a Noisy-TV

  distractor produces ρ ≈ 1.0 (no learnable structure). The gate accepts the

  dimension only if ρ < θ (θ=0.90) AND the existing MDL consistency criterion

  passes.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "Step-by-step experiment:\n\n1. Re-implement Arm P (WUP-MDL, W=100)\
  \ as the baseline from iter_017, to\n   confirm reproducibility and provide a matched\
  \ comparison.\n\n2. Implement Arm S (EG-MDL, W=100, θ=0.90):\n   a. During the WUP\
  \ period, record per-step prediction error e[t] for the\n      proposed 4th dimension.\n\
  \   b. At the end of WUP (step W), compute:\n      E_early = mean(e[0 : W/2])\n\
  \      E_late  = mean(e[W/2 : W])\n      ρ = E_late / E_early\n   c. The composite\
  \ gate accepts the dimension if:\n      - MDL criterion: L_consistency < 1.0 (existing\
  \ WUP-MDL gate)\n      - Prediction-trend: ρ < 0.90 (NEW: at least 10% error reduction)\n\
  \   d. If both pass, the dimension is permanently recruited.\n   e. If either fails,\
  \ the dimension is rejected and pruned.\n\n3. Implement Arm T (EG-MDL-Spatial, W=100,\
  \ θ=0.90, η=0.50):\n   a. Same as Arm S, plus an additional spatial entropy gate.\n\
  \   b. Compute spatial entropy H = -Σ p_i log(p_i) where p_i are the\n      soft-argmax\
  \ attention weights for the proposed dimension.\n   c. Normalize: H_norm = H / H_max\
  \ where H_max = log(N_spatial).\n   d. Gate requires H_norm < 0.50 (spatially concentrated\
  \ attention).\n   e. This tests whether spatial concentration provides a complementary\n\
  \      distractor-rejection signal beyond prediction-trend alone.\n\n4. Run a transition\
  \ sweep (5 matched seeds: 42, 123, 456, 789, 1337) with\n   N=3→4 object introduction.\
  \ Measure: recruitment rate, centroid decoding\n   MSE, test simulation loss.\n\n\
  5. Run a Noisy-TV control sweep (same 5 seeds) replacing the 4th object\n   with\
  \ a localized Noisy-TV pixel distractor. Measure: false recruitment\n   rate, centroid\
  \ MSE (should be high/meaningless for false recruitments).\n\n6. Compare Arms P,\
  \ S, T using Welch's t-test on false recruitment rate and\n   centroid MSE. Report\
  \ mean ± std for all metrics.\n\nFiles to modify:\n- src/thalamus.py: Add prediction-trend\
  \ gate logic, per-step error buffering\n  during WUP, improvement ratio computation,\
  \ and composite gate evaluation.\n- New configuration entries for Arm S (θ=0.90)\
  \ and Arm T (θ=0.90, η=0.50).\n- Experimental runner script to execute both sweeps\
  \ and collect metrics.\n"
