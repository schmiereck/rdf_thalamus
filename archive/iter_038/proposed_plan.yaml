falsification_criterion: 'The hypothesis is falsified if ANY gate fails under the
  per-seed decision rule:


  Gate-1 FAIL: Fewer than 4 of 5 seeds achieve mean per-object probe-event

  count ≤ 3.0 under RANDOM navigation. This means the moving pointer creates

  too many information events, leaving insufficient headroom for ORACLE targeting.


  Gate-1b FAIL: Either (a) mean per-seed CV < 0.30, meaning the heterogeneity

  is too weak to be structurally meaningful even after averaging across seeds; or

  (b) std(per-seed CVs) > 0.25, meaning the heterogeneity is not reproducible —

  it varies wildly from seed to seed, dominated by trajectory luck rather than

  structural spatial effects.


  Gate-2 FAIL: Fewer than 4 of 5 seeds achieve per-object probe-event CV ≥ 0.50.

  This means random navigation does not create sufficient per-object heterogeneity

  for ORACLE''s targeted perception to exploit.


  If any gate fails, the behavioral-validation strategy is declared not tractable

  within project scope, and the project pivots to path (ii) re-frame.

  '
hypothesis: 'In a 2D arena (64×64, N=3 objects) with a PHYSICALLY NAVIGATING pointer
  (random

  acceleration ∈ [-1.5, 1.5]², velocity capped at 3.5 px/step per component) that

  must navigate to objects and actively probe them (probe probability p=0.015 per

  step when within PROBE_RADIUS=10 of any object, budget=15 probes), the three

  structural constraints that blocked the behavioral bracket across iter_033-037

  are simultaneously relaxed:


  Gate-1 (Non-saturation): Mean per-object probe-event count under RANDOM

  navigation ≤ 3.0. Random navigation produces bounded, non-saturating

  information access because 2D geometry allows off-axis passage and the probe

  budget + probability cap total events.


  Gate-1b (CV stability): Per-object probe-event count CV is structurally

  meaningful and reproducible across seeds (mean per-seed CV ≥ 0.30 AND

  std(per-seed CVs) ≤ 0.25). The navigation pointer creates enough events

  (estimated ~7-10 per seed) for CV to reflect structural spatial clustering

  rather than Poisson noise, unlike iter_037 where 0-1 events per seed made

  CV undefined or noise-dominated.


  Gate-2 (Heterogeneity): Mean per-seed per-object probe-event CV ≥ 0.50

  (with ≥4/5 seeds individually ≥ 0.50). A 2D random walk with moderate speed

  (~3 px/step) in a 64×64 arena has mixing time ~455 steps; over 2000 steps

  (~4.4 mixing times), the walk retains partial spatial structure, creating

  naturally uneven per-object visit rates. Objects in the center sector (where

  the walk starts and to which wall-bounces frequently redirect) receive more

  visits than objects in peripheral sectors.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "## Experiment: 2D Navigation Gate Probe\n\n### Step 1 — Pre-Registration\
  \ and Null Finding Preservation\nUpdate src/pre_registration.md with iter_038 parameters\
  \ and gate definitions.\nPreserve the iter_037 null finding document (archive/iter_037/results/null_finding_1d.md)\n\
  as a standing reference — no modification.\n\n### Step 2 — Implement Navigation\
  \ Gate Experiment\nCreate src/run_iter038_nav_gates.py extending PhysicsSandbox2D\
  \ from iter_037.\n\n**Environment parameters (pre-registered, FROZEN):**\n- Arena:\
  \ 64×64 (same as iter_037)\n- N=3 objects (same as iter_037: radius ∈ [3.0, 8.0],\
  \ mass=radius,\n  velocity per component ∈ [-2.0, -0.5] ∪ [0.5, 2.0])\n- Pointer:\
  \ radius=4, mass=10, starts at (32, 32) with velocity (0, 0)\n- Substeps: 10, dt\
  \ = 1/substeps\n- Seeds: [7, 31, 53, 71, 83] (same as iter_037)\n\n**Navigation\
  \ (RANDOM policy):**\n- Each step: sample 2D acceleration from Uniform[-1.5, 1.5]²\n\
  - Apply acceleration to pointer velocity via substep integration\n- Velocity cap:\
  \ 3.5 px/step per component (applied after each step)\n- Physical elastic collisions\
  \ between pointer and objects (same as iter_037)\n- Wall bounces for pointer and\
  \ objects (same as iter_037)\n\n**Probe mechanism:**\n- PROBE_RADIUS = 10.0 (pointer\
  \ center within 10 pixels of object center)\n- At each step, if any object is within\
  \ PROBE_RADIUS, a probe opportunity exists\n- Probe decision: probability p = 0.015\
  \ per step (when opportunity exists)\n- Probe budget: 15 total probes per rollout\n\
  - On successful probe: record event for the NEAREST object within PROBE_RADIUS\n\
  - After budget exhausted: pointer still navigates but no more probe events\n- Physical\
  \ collisions are SEPARATE from probe events (collision dynamics still\n  occur,\
  \ but don't count as information events for the gates)\n\n**Measurements (per seed):**\n\
  - Per-object probe-event counts (count_0, count_1, count_2)\n- Per-object probe-event\
  \ CV = std(counts) / mean(counts)\n- Per-object valid collision counts (diagnostic,\
  \ for comparison with iter_037)\n- Per-object proximity-event counts (diagnostic:\
  \ within PROBE_RADIUS, no probe)\n- Total probes fired, budget remaining\n- Pointer\
  \ trajectory statistics (mean speed, arena coverage)\n\n**Gate definitions:**\n\
  Gate-1 (Non-saturation):\n- Metric: mean per-object probe-event count\n- Threshold:\
  \ ≤ 3.0\n- Per-seed rule: ≥4/5 seeds must individually pass\n- Justification: same\
  \ as iter_037; 3.0 provides headroom for ORACLE to\n  produce 5-10× more events\
  \ via targeted navigation\n\nGate-1b (CV stability):\n- Condition (a): mean of per-seed\
  \ CVs across 5 seeds ≥ 0.30\n- Condition (b): std of per-seed CVs across 5 seeds\
  \ ≤ 0.25\n- Both conditions must hold\n- Justification: (a) ensures the heterogeneity\
  \ is not trivially zero;\n  (b) ensures it's reproducible (not driven by lucky/unlucky\
  \ trajectories).\n  In iter_037, per-seed CVs were [0.00, 1.41, 0.82, 0.00, 1.41]\
  \ (std=0.62)\n  — wildly unstable. With active navigation producing more events,\n\
  \  CV should be more stable.\n\nGate-2 (Heterogeneity):\n- Metric: per-seed per-object\
  \ probe-event CV\n- Threshold: ≥ 0.50\n- Per-seed rule: ≥4/5 seeds must individually\
  \ pass\n- Justification: CV ≥ 0.50 indicates meaningful per-object heterogeneity\n\
  \  that ORACLE's targeted navigation could exploit differently than RANDOM.\n  Below\
  \ 0.50, the random navigator already accesses all objects fairly\n  equally, leaving\
  \ no behavioral leverage for perception.\n\n**Sanity checks:**\n- S1: Physics conservation\
  \ (2D elastic collision, same as iter_037)\n- S2: Pointer stays within [0, 64]²\
  \ throughout\n- S3: Objects stay within [0, 64]² throughout\n- S4: RANDOM navigation\
  \ actually applies random acceleration (no targeting)\n- S5: Velocity cap enforced\
  \ (max 3.5 per component per step)\n- S6: Probe mechanism fires correctly (within\
  \ PROBE_RADIUS, with probability)\n- S7: PASSIVE sanity check: rerun iter_037 Gate-1\
  \ on 1 seed to confirm\n  static pointer still gives mean ≤ 3.0 (re-verification,\
  \ not new measurement)\n\n### Step 3 — Geometric Argument for Joint Gate Satisfaction\n\
  \n**Why this design escapes the Gate-1/Gate-1b opposition identified in iter_037:**\n\
  \nIn iter_037 (static pointer at center), the opposition was:\n- Gate-1 passes \"\
  too well\" → collisions are very rare (0-1 per object)\n- Gate-1b fails → too few\
  \ events for CV to be structurally meaningful\n- These are coupled: the same geometric\
  \ fact (2D allows off-axis passage)\nthat keeps collisions low also makes them too\
  \ rare for CV measurement.\n\nThe navigation task DECOUPLES these concerns through\
  \ two mechanisms:\n\n(1) **Active event generation:** The moving pointer traverses\
  \ the arena,\nencountering objects more frequently than the static pointer. The\
  \ probe\nmechanism (PROBE_RADIUS=10, p=0.015) produces ~7-10 probe events per seed\n\
  (vs 0-2 for the static pointer), providing enough data for CV to be\nstructurally\
  \ meaningful. This addresses Gate-1b directly.\n\n(2) **Budget-capped event rate:**\
  \ The probe budget (15) and probability\n(0.015) ensure the total event rate is\
  \ bounded, even though the pointer\nmoves. The estimated mean per-object count (~2.3)\
  \ is well below the Gate-1\nthreshold of 3.0. This preserves Gate-1.\n\nThe coupling\
  \ is broken because event generation is now determined by\nnavigation (which the\
  \ agent controls) rather than passive collision\nprobability (which is a fixed property\
  \ of the geometry).\n\n**Why spatial clustering supports Gate-2:**\n\nA 2D random\
  \ walk with speed ~3 px/step in a 64×64 arena has diffusion\ncoefficient D ≈ 4.5\
  \ and mixing time τ_mix ≈ L²/(2D) ≈ 455 steps. Over\n2000 steps (~4.4 τ_mix), the\
  \ walk retains partial spatial structure:\n- The walk's position is autocorrelated\
  \ (it tends to continue in the same\n  direction for 50-100 steps before changing\
  \ course)\n- It spends extended periods near one object before diffusing to another\n\
  - Objects in the center sector (where the walk starts and to which wall\n  bounces\
  \ frequently redirect) receive more visits than peripheral objects\n\nWith segment-based\
  \ object initialization (Object 1 in the center sector),\nthe pointer starts near\
  \ Object 1 and visits it more frequently in the\nfirst ~500 steps. This initial\
  \ bias persists even after mixing because\nthe walk returns to the center more often\
  \ (wall bounces redirect toward\ncenter). The expected per-object visit probability\
  \ distribution is\napproximately [0.25, 0.40, 0.35], producing expected CV ≈ 0.50\
  \ from\nstructural asymmetry alone. Random walk clustering amplifies this above\n\
  the Poisson baseline (~0.39 for uniform allocation of 9 probes).\n\n### Step 4 —\
  \ Run Experiment and Record Results\nExecute src/run_iter038_nav_gates.py, save\
  \ all results to\narchive/iter_038/results/.\n\n### Step 5 — Apply Pre-Committed\
  \ Exit Rule\n\n**PASS branch (all three gates clear):**\nWrite up the result. Explicitly\
  \ hand off to HUMAN go/no-go on full 2D rebuild.\nThe agent does NOT auto-start\
  \ the rebuild. The human decides whether to commit\n~10-14 iterations to the 2D\
  \ migration. Document:\n- The specific gate measurements that passed\n- The estimated\
  \ cost/scope of a full 2D rebuild (from iter_037 decision support)\n- What carries\
  \ over unchanged (M1, M3, iter_028 substrate, decoder-free)\n- What must be rebuilt\
  \ (2D encoder, 2D soft-argmax, production PhysicsSandbox2D,\n  2D CLTSMotorController,\
  \ re-validate non-collapse, re-validate bracket)\n- Caveat: gates passing does NOT\
  \ guarantee the full bracket discriminates\n\n**FAIL branch (any gate fails):**\n\
  Declare the behavioral-validation strategy not tractable within project scope.\n\
  Iter_039 becomes path (ii) re-frame, with the following pre-registered\nfalsifiable\
  \ claims (each with its own gate):\n\n1. **M1 pooled-VICReg necessity:** Without\
  \ batch-level VICReg, the\n   separate-backbone architecture collapses in ≥4/5 seeds.\
  \ Gate: train\n   without VICReg; check has_collapsed or per-dim std < 5.0.\n\n\
  2. **iter_028 collapse mechanism:** sim_loss_dyn is the causal driver of\n   z_dyn\
  \ collapse on the shared backbone (removing it reduces collapse from\n   ≥30% to\
  \ ≤10%); the separate backbone eliminates collapse regardless.\n   Gate: (a) shared\
  \ backbone without sim_loss_dyn collapses ≤1/5 seeds;\n   (b) separate backbone\
  \ collapses 0/5 seeds.\n\n3. **iter_031 mean-pool bottleneck:** Mean-pool spatial\
  \ readout limits\n   ΔR²_color < 0.10. No alternative readout achieves ΔR² ≥ 0.30\
  \ without\n   collapse. Gate: test centroid-gated or max-pool; falsified if any\n\
  \   achieves ΔR² ≥ 0.30 in ≥4/5 seeds.\n\n4. **Structural-ceiling-gate primitive:**\
  \ The analytical ceiling gate\n   (measuring PASSIVE information access to predict\
  \ bracket viability)\n   is a valid research primitive. Gate: apply to a fresh task\
  \ with known\n   ground-truth discriminability; falsified if prediction is wrong.\n\
  \n5. **1D environmental null (documented):** The four-iteration null chain\n   (iter_033-036)\
  \ is a standing negative finding — not re-tested but\n   preserved as a citable\
  \ result.\n\n6. **2D navigation null (from iter_038):** The specific gate failure\
  \ from\n   iter_038 is documented with the failure mode, parameterization, and\n\
  \   measured values — a data point, not a narrative.\n\nEach claim is falsifiable\
  \ with its own gate. The re-frame is NOT a\ndeliverable-by-narration; it is a set\
  \ of specific, testable, quantitative\nclaims about the representation, methodology,\
  \ and environmental findings.\n\n### Files Created\n- src/run_iter038_nav_gates.py\
  \ (new — 2D navigation gate experiment)\n- src/pre_registration.md (updated with\
  \ iter_038 parameters)\n- archive/iter_038/results/ (output directory with gate\
  \ results)\n\n### Files Preserved (NO modification)\n- src/environment.py (1D environment\
  \ unchanged)\n- src/models_dual_stream.py (1D encoder unchanged)\n- src/models_separate_dyn.py\
  \ (separate backbone unchanged)\n- src/motor.py (CLTSMotorController unchanged)\n\
  - src/run_iter037_2d_gates.py (preserved for reference)\n- All standing mandates\
  \ (M1, M3, GDASR log-only, decoder-free, iter_028 substrate)\n- M2 remains untestable,\
  \ not falsified\n"
