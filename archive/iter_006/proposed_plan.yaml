falsification_criterion: 'The hypothesis will be proven false if:

  1. ThalamusNet fails to recruit a new dimension within 500 steps of the 4th object''s
  introduction, or its prediction loss on the novel object is not at least 30% lower
  than B1.

  2. The prediction loss ratio (L_noise / L_clean) for ThalamusNet under dynamic noise
  is less than 1.5x lower than the ratio of B1 or B2.

  3. The attention token''s spatial tracking overlap with the physical objects falls
  below 60% in the presence of dynamic noise, indicating attentional trapping by the
  unpredictable background.

  '
hypothesis: 'In the Phase 4 Generalization and Noise Robustness evaluation:

  1. Under clean conditions, introducing a 4th unseen object to a network trained
  on N=3 objects will trigger dynamic dimension recruitment in ThalamusNet within
  500 timesteps, reducing few-shot prediction loss on the novel object by at least
  30% relative to a fixed-dimension JEPA (B1) baseline.

  2. Under dynamic background noise (i.i.d. pixel-level Gaussian noise, σ = 0.15),
  ThalamusNet''s hierarchical latent representations and VICReg-based covariance regularization
  will project out high-frequency spatial-temporal noise, resulting in a prediction
  loss ratio (L_noise / L_clean) that is at least 2.0x lower than that of B1 (JEPA)
  and B2 (NGC) baselines.

  3. The Thalamic Attention watch-dog is resilient to the Noisy-TV trap; the attention
  token will spend at least 70% of its active timesteps tracking the structured physical
  entities rather than the unpredictable background noise.

  '
pre_registration_file: src/pre_registration.md
proposed_method: "1. Modify the 1D physics sandbox (in src/) to support:\n   a. Static\
  \ background noise (constant random pixel offset pattern).\n   b. Dynamic background\
  \ noise (i.i.d. Gaussian noise σ = 0.15 added to background pixels at each timestep).\n\
  \   c. N=4 object initialization with a novel, unseen physical parameter range (size,\
  \ mass, color, velocity).\n2. Run a 5-seed comparison sweep evaluating ThalamusNet,\
  \ B1 (JEPA), and B2 (NGC) under:\n   - Clean test environments.\n   - Static noise\
  \ environments.\n   - Dynamic noise (Noisy-TV) environments.\n3. Perform the 4-object\
  \ generalization test: train on N=3, inject the 4th object, and log prediction error\
  \ curves, dimension recruitment timesteps, and post-recruitment specialization.\n\
  4. Perform the causal-sensitivity sweep on the 4th object by altering its mass/velocity\
  \ post-collision and measuring prediction adaptation times.\n5. Log the complete\
  \ Phase 4 metrics battery: compute/memory profiles (FLOPs/timestep), plasticity-token\
  \ traces, and the transition from externally primed to self-generated attention\
  \ under noisy conditions.\n"
