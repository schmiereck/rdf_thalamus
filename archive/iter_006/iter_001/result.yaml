experimenter_view: 'The Phase 4 noise extensions have been successfully integrated
  into the PhysicsSandbox environment.

  We implemented global high-frequency noise using i.i.d. Gaussian pixel offsets,
  and localized structured

  entropic noise using a Noisy-TV entity that performs a random walk within bounds
  and flickers color at

  maximum entropy. A test script verified that the Noisy-TV entity exhibits correct
  physical dimensions,

  random-walk motion (std=2.25), and high color variance (var~0.04) while properly
  blending into the

  render canvas. The updated pre-registration establishes a rigorous, relativistic
  falsification criterion

  for evaluating attention tracking resilience ($Overlap_{noise} >= 0.8 * Overlap_{clean}$)
  under these noise sources.

  '
