task: "Implement and run integration tests for Thalamus Phase 1.\nSpecifically:\n\
  1. Review src/pre_registration.md.\n2. Implement src/environment.py:\n   - A 1D\
  \ physics sandbox representing a 1D array of 128 RGB pixels.\n   - It simulates\
  \ N elastic colliding objects with randomized sizes, colors, masses, and initial\
  \ velocities.\n   - Physics must correctly handle boundary bounces and elastic collisions\
  \ between objects (momentum and energy conservation).\n   - The environment must\
  \ support varying object counts (N=2 and N=3) and parameter randomization (colors,\
  \ sizes, masses) to prevent dark-room collapse.\n   - It should output observations\
  \ of shape (3, 128) per step.\n3. Implement src/models.py:\n   - An Encoder (1D\
  \ CNN or MLP) mapping observations of shape (3, 128) to latent space of size up\
  \ to D_max=8, with only the first d_t dimensions active.\n   - A Predictor forecasting\
  \ the active latent states z_{t+1} from history (e.g., delay-line context or MLP\
  \ with last 3 steps of history).\n   - FixedJEPA (Baseline B1 with fixed d_t=2,\
  \ and Baseline B1-Large with fixed d_t=3).\n   - DynamicJEPA implementing GDASR:\
  \ starts with d_t=2, tracks EMA of prediction error. Define an adaptive recruitment\
  \ trigger based on stable 2-object error mean and standard deviation (recruit if\
  \ error > mean + k * std, with k=4 and cooldown N_cooldown=500).\n   - Implement\
  \ VICReg-style loss:\n     - Invariance loss: Mean Squared Error of the prediction\
  \ in active latent space.\n     - Variance loss: push standard deviations of active\
  \ dimensions to be >= 1.\n     - Covariance loss: minimize cross-correlations between\
  \ active dimensions.\n     - Ensure variance/covariance calculations are done on\
  \ batch dimension.\n   - Implement weight freezing/stop-gradient on existing dimensions\
  \ when a new dimension is recruited for a short stabilization period (e.g., 200\
  \ steps).\n4. Implement a short integration test script src/test_integration.py\
  \ to verify that:\n   - The environment runs and objects collide correctly.\n  \
  \ - The models can perform forward passes, compute VICReg loss, and update weights.\n\
  \   - DynamicJEPA can trigger recruitment of a dimension.\n   - No NaNs or shape\
  \ errors occur.\nRun src/test_integration.py and write a brief summary of the validation.\
  \ Do not run the full experiments yet; just verify the code works."
