  2. Exp lambda=0 (Output-as-input targets, lambda_spatial=0.0)

  3. Exp lambda=0.01 (Output-as-input targets, lambda_spatial=0.01)

  4. Exp lambda=0.1 (Output-as-input targets, lambda_spatial=0.1)

  5. Exp lambda=1.0 (Output-as-input targets, lambda_spatial=1.0)


  The script is syntactically correct and fully warning-free. It properly implements:

  - Phase 1: Base N=3 passive training with GDASR recruitment of the 3rd dimension
  and stable error-collection reset at step 1001.

  - Phase 2: Cloning and active N=4 training with output-as-input centroid target
  calculation and spatial bottlenecking loss.

  - Phase 3: Fresh evaluation on 200 test transitions from seed + 5000, measuring
  Pearson correlation, post-hoc decoding MSE, soft spatial variance, and Criterion
  5 representation collapse metrics.

  - Phase 4: Compiling summary results, generating a visualization, and outputting
  a comprehensive markdown report analyzing the falsification criteria.

  '
