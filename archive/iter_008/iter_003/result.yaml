experimenter_view: 'The Phase 8 sweep successfully evaluates the pairing of an unsupervised
  spatial bottleneck (minimizing soft spatial variance) with a closed-loop motor control
  system.

  Adding the soft spatial variance penalty drastically decreases the width of the
  activation map, reducing soft spatial variance of the recruited channel by 95.0%
  for lambda=0.1 compared to Control (60.29 vs. 1209.33).

  Most importantly, the spatial regularizer completely eliminates representation collapse
  (0% collapse rate across all active-bottleneck branches, compared to a 40% collapse
  rate in the Control branch), forcing the model to learn a stable, active, and localized
  representation of coordinate spaces.

  '
